[build]
  publish = "vanguard"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VAPID_PUBLIC_KEY"

[build.processing]
  skip_processing = true

[functions.push-send]
  schedule = "0 7 * * *"

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/clean/waitlist"
  to = "/clean/waitlist.html"
  status = 200

[[redirects]]
  from = "/clean/*"
  to = "/clean/index.html"
  status = 200
