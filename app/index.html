// Demo writes mutate the in-memory store so the visitor's actions (ticking, logging temps)
// actually take effect — the ring fills, records populate, and confetti fires at 100%.
const _demoWrite=(table,d,upsert)=>{
  const store=_demoBuild();
  const arr=store[table]||(store[table]=[]);
  (Array.isArray(d)?d:[d]).forEach(row=>{
    const r=Object.assign({},row);
    if(!r.id) r.id='demo-'+table+'-'+Date.now()+'-'+Math.floor(Math.random()*10000);
    if(upsert){ const idx=arr.findIndex(x=>x.user_id===r.user_id&&x.date===r.date); if(idx>=0){arr[idx]=Object.assign({},arr[idx],r);return;} }
    arr.unshift(r);
  });
};
const _demoFrom=table=>({
  select:(c,o)=>new _DemoQ(table).select(c,o),
  insert:async d=>{_demoWrite(table,d,false);return{data:null,error:null};},
  upsert:async d=>{_demoWrite(table,d,true);return{data:null,error:null};},
  update:()=>new _DemoU(table),
});

    getSession: async () => ({data:{session:_getS()},error:null}),
    signUp: async ({email,password,options}) => {
      // Pass name/business/referral as user_metadata so the DB trigger populates the
      // profile reliably — works whether or not email confirmation is on.
      const r=await fetch(`${SUPA_URL}/auth/v1/signup`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:options?.data||{}})});
      const d=await r.json();
      if(!r.ok || d.error || d.error_description || (d.msg && !d.id && !d.access_token)){
        return {error:{message:d.error_description||d.msg||d.message||'Sign up failed. Please try again.'}};
      }
      const uid=d.user?.id||d.id;
      // Email confirmation ON → no session yet. Profile is created by the trigger.
      if(!d.access_token){
        return {data:{session:null,user:d.user||d},error:null};
      }
      // Autoconfirm → we have a session. (Trigger also creates the profile; this is a safe fallback.)
      await fetch(`${SUPA_URL}/rest/v1/profiles`,{method:'POST',headers:{..._h(d.access_token),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:uid,name:options?.data?.name,business_name:options?.data?.businessName})}).catch(()=>{});

      _saveS(s); _ls.forEach(fn=>fn('SIGNED_IN',s));
      return {data:{session:s},error:null};
    },
    signInWithPassword: async ({email,password}) => {
      const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});

      const s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};

// ── OFFLINE QUEUE ─────────────────────────────────────────────────────────────
const _OQ_KEY='vg_offline_queue';
const _getQ=()=>{try{return JSON.parse(localStorage.getItem(_OQ_KEY)||'[]');}catch{return[];}};
const _saveQ=q=>localStorage.setItem(_OQ_KEY,JSON.stringify(q));
const _addQ=item=>{const q=_getQ();q.push({...item,qid:Date.now()+Math.random().toString(36).slice(2)});_saveQ(q);};
const replayOfflineQueue=async()=>{
  const q=_getQ();
  if(!q.length) return 0;
  const remain=[];
  for(const item of q){
    try{
      const tok=_getS()?.access_token||item.tok;
      const heads={..._h(tok)};
      if(item.prefer) heads['Prefer']=item.prefer;
      const r=await fetch(`${SUPA_URL}/rest/v1/${item.table}${item.oc||''}`,{method:'POST',headers:heads,body:JSON.stringify(item.data)});
      if(!r.ok) remain.push(item);
    }catch{remain.push(item);}
  }
  _saveQ(remain);
  return q.length-remain.length;
};

const today = () => new Date().toISOString().slice(0,10);
const nowTime = () => new Date().toTimeString().slice(0,5);
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtDateShort = d => new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
// Relative timestamp for the activity feed: "10:42" if today, else "14 Jul".
const fmtWhen = ts => { try{ const d=new Date(ts); if(isNaN(d)) return ''; const isToday=d.toISOString().slice(0,10)===today(); return isToday?d.toTimeString().slice(0,5):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }catch{return '';} };
// Per-day "not needed today" markers (e.g. water on a non-trading day). Keyed by day so
// they only excuse the check for today, never permanently. Mirrors the vg_na_* pattern.
const naDayKey = (userId,kind) => `vg_naday_${kind}_${userId}_${today()}`;
const isNADay = (userId,kind) => { try{ return localStorage.getItem(naDayKey(userId,kind))==='1'; }catch{ return false; } };
const setNADayFlag = (userId,kind,val) => { try{ localStorage.setItem(naDayKey(userId,kind), val?'1':'0'); }catch{} };
// ── Analytics: GA4 funnel events. track() is suppressed in demo mode so sample
// interactions never pollute the real funnel; trackOnce() fires a milestone only once.
const gaEvent = (name,params) => { try{ if(typeof window!=='undefined'&&window.gtag) window.gtag('event',name,params||{}); }catch{} };
const track = (name,params) => { if(typeof window!=='undefined'&&window.__vgDemo) return; gaEvent(name,params); };
const trackOnce = (key,name,params) => {
  if(typeof window!=='undefined'&&window.__vgDemo) return;
  let seen=false; try{ seen=!!localStorage.getItem('vg_ev_'+key); }catch{}
  if(seen) return;
  try{ localStorage.setItem('vg_ev_'+key,'1'); }catch{}
  gaEvent(name,params);
};

// ── LIVE COMPLIANCE (today's %) ───────────────────────────────────────────────
// Same 4-part logic as the Dashboard: diary (opening+closing), 2+ temps, cleaning, unit.
async function computeTodayCompliance(userId){
  try{
    const todayStr=today();
    const [{data:tD},{data:tT},{data:tC2},{data:tV},{data:prof},{data:lpgR},{data:wT}]=await Promise.all([
      sb.from('diaries').select('opening,closing').eq('user_id',userId).eq('date',todayStr),
      sb.from('temp_logs').select('id').eq('user_id',userId).eq('date',todayStr),
      sb.from('cleaning_logs').select('id').eq('user_id',userId).eq('date',todayStr),
      sb.from('van_checks').select('id').eq('user_id',userId).eq('date',todayStr),
      sb.from('profiles').select('lpg_enabled,water_enabled').eq('id',userId).maybeSingle(),
      sb.from('lpg_logs').select('created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(1),
      sb.from('water_logs').select('id').eq('user_id',userId).eq('date',todayStr),
    ]);
    let na={};try{na=JSON.parse(localStorage.getItem('vg_na_diary_'+userId))||{};}catch{}
    const rmO=readRemoved(userId,'opening'),rmC=readRemoved(userId,'closing');
    const d0=tD&&tD[0];
    const openDone=!!d0&&DEFAULT_OPENING.every((_,i)=>rmO.includes(i)||(d0.opening&&d0.opening[i])||na['o'+i]);
    const closeDone=!!d0&&DEFAULT_CLOSING.every((_,i)=>rmC.includes(i)||(d0.closing&&d0.closing[i])||na['c'+i]);
    const items=[openDone&&closeDone,(tT?.length||0)>=2,!!(tC2?.length),!!(tV?.length)];
    // LPG is a monthly requirement: counts as a check, satisfied while a check is within 30 days.
    if(prof?.lpg_enabled!==false){ const r=lpgR&&lpgR[0]; items.push(!!r&&(Date.now()-new Date(r.created_at))/86400000<=30); }
    // Water is a daily check (only for units that use it): a log today or "not needed today".
    if(prof?.water_enabled===true){ items.push((wT?.length||0)>0||isNADay(userId,'water')); }
    const done=items.filter(Boolean).length;
    return Math.round(done/items.length*100);
  }catch{return 0;}
}
const complianceColor=(p)=>`hsl(${(30+(140-30)*(Math.max(0,Math.min(100,p))/100)).toFixed(1)},78%,45%)`;
const ComplianceRing=({pct=0,variant='header',onClick})=>{
  const size=variant==='sidebar'?60:38;
  const sw=variant==='sidebar'?6:4.5;
  const r=(size-sw)/2-1, c=2*Math.PI*r;
  const col=complianceColor(pct);

  const fs=variant==='sidebar'?18:12;
  return (
    <button onClick={onClick} aria-label={`Today ${pct}% complete — open dashboard`}
      className={`flex-shrink-0 flex items-center justify-center active:scale-95 transition-transform ${variant==='sidebar'?'flex-col gap-1.5':''}`}

        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.16)" strokeWidth={sw}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={c*(1-Math.max(0,Math.min(100,pct))/100)} transform={`rotate(-90 ${size/2} ${size/2})`}

        </svg>
        <span className={`absolute inset-0 flex items-center justify-center font-black ${done?'vg-ring-pulse':''}`}
          style={{color:col,fontSize:done?fs+3:fs,lineHeight:1,transition:'color .9s linear'}}>{done?'✓':pct}</span>
      </span>
      {variant==='sidebar'&&<span className="text-[10px] font-bold uppercase tracking-wider" style={{color:done?col:'rgba(255,255,255,0.5)',transition:'color .9s'}}>{done?'Up to date':'Today'}</span>}

// ── CONFETTI (plays once on success) ──────────────────────────────────────────
const Confetti=({show,onDone})=>{
  const ref=useRef(null);
  useEffect(()=>{
    if(!show) return;
    if(!ref.current||!window.lottie){ const t=setTimeout(()=>onDone&&onDone(),100); return ()=>clearTimeout(t); }
    let anim;
    try{
      anim=window.lottie.loadAnimation({container:ref.current,renderer:'svg',loop:false,autoplay:true,path:'/success-confetti.json'});
      anim.addEventListener('complete',()=>onDone&&onDone());
    }catch{ onDone&&onDone(); }
    const safety=setTimeout(()=>onDone&&onDone(),4500);
    return ()=>{clearTimeout(safety);try{anim&&anim.destroy();}catch{}};
  },[show]);
  if(!show) return null;
  return <div ref={ref} className="fixed inset-0 z-[200] pointer-events-none flex items-center justify-center" aria-hidden="true"/>;
};

const IsoCarousel = ({bg='#0C1628'}) => {
  const stkRef=useRef(null);
  const titleRef=useRef(null);
  const dotsRef=useRef(null);
  const wrapRef=useRef(null);
  useEffect(()=>{
    const S=[
      {t:'Dashboard',img:'/shots/dashboard.jpg'},
      {t:'Temperatures',img:'/shots/temps.jpg'},
      {t:'Daily Checks',img:'/shots/diary.jpg'},
      {t:'Safety & Equipment',img:'/shots/safety.jpg'},
      {t:'Records',img:'/shots/records.jpg'},
    ];
    const ZP=[115,58,0,-58,-115],OP=[1,0.82,0.64,0.48,0.34];
    const mkP=s=>`<div style="position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#0C1628"><img src="${s.img}" alt="${s.t}" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block"/></div>`;
    const stk=stkRef.current,titleEl=titleRef.current,dotsEl=dotsRef.current;
    if(!stk)return;
    const cards=S.map((s,i)=>{
      const d=document.createElement('div');
      d.style.cssText='position:absolute;top:50%;left:50%;width:122px;height:208px;background:#05070d;border:1px solid rgba(255,255,255,0.16);border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:5px;box-sizing:border-box;will-change:transform,opacity';
      d.innerHTML=mkP(s);
      d.style.transform=`translate(-50%,-50%) translateZ(${ZP[i]}px)`;
      d.style.opacity=String(OP[i]);
      d.style.zIndex=String(10-i);
      stk.appendChild(d);
      return d;
    });
    let queue=[0,1,2,3,4],busy=false;
    const updateUI=()=>{
      if(titleEl)titleEl.textContent=S[queue[0]].t.toUpperCase();
      if(dotsEl)dotsEl.querySelectorAll('.iso-dot').forEach((d,i)=>{d.className='iso-dot'+(queue[0]===i?' iso-on':'');});
    };
    if(dotsEl){
      S.forEach((_,i)=>{
        const d=document.createElement('span');
        d.className='iso-dot'+(i===0?' iso-on':'');
        d.style.cssText='width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.22);display:inline-block;margin:0 3px;cursor:pointer;transition:all 0.3s;vertical-align:middle';
        d.onclick=()=>{
          if(busy||queue[0]===i)return;
          const pos=queue.indexOf(i);if(pos<0)return;
          queue=[...queue.slice(pos),...queue.slice(0,pos)];
          queue.forEach((sc,p)=>{cards[sc].style.transition='transform 0.46s cubic-bezier(0.4,0,0.2,1),opacity 0.36s';cards[sc].style.transform=`translate(-50%,-50%) translateZ(${ZP[p]}px)`;cards[sc].style.opacity=String(OP[p]);cards[sc].style.zIndex=String(10-p);});
          updateUI();
        };
        dotsEl.appendChild(d);
      });
    }
    // Dot active style via JS since we can't use a <style> tag cleanly in useEffect
    const styleEl=document.createElement('style');
    styleEl.textContent='.iso-on{background:#0D7377!important;width:20px!important;border-radius:3px!important}';
    document.head.appendChild(styleEl);
    const advance=()=>{
      if(busy)return;busy=true;
      const fi=queue[0],fc=cards[fi];
      fc.style.transition='transform 0.30s cubic-bezier(0.2,0,0.4,1),opacity 0.22s';
      fc.style.transform='translate(-50%,-50%) translateZ(210px) rotateY(-18deg) translateY(-6px)';
      fc.style.opacity='0.72';fc.style.zIndex='20';
      setTimeout(()=>{
        for(let p=1;p<5;p++){const sc=queue[p];cards[sc].style.transition='transform 0.50s cubic-bezier(0.4,0,0.2,1),opacity 0.38s';cards[sc].style.transform=`translate(-50%,-50%) translateZ(${ZP[p-1]}px)`;cards[sc].style.opacity=String(OP[p-1]);cards[sc].style.zIndex=String(10-(p-1));}
        fc.style.transition='transform 0.50s cubic-bezier(0.55,0,0.9,0.5),opacity 0.30s';
        fc.style.transform='translate(-50%,-50%) translateZ(-175px) rotateY(0deg) translateY(0px)';
        fc.style.opacity='0';
        setTimeout(()=>{
          const f=queue.shift();queue.push(f);
          fc.style.transition='none';fc.style.transform=`translate(-50%,-50%) translateZ(${ZP[4]}px)`;fc.style.zIndex='6';
          setTimeout(()=>{fc.style.transition='opacity 0.28s';fc.style.opacity=String(OP[4]);},30);
          updateUI();busy=false;
        },520);
      },310);
    };
    let timer=setInterval(advance,3800);
    const wrap=wrapRef.current;
    const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
    if(wrap&&!isTouch){
      wrap.addEventListener('mouseenter',()=>clearInterval(timer));
      wrap.addEventListener('mouseleave',()=>{clearInterval(timer);timer=setInterval(advance,3800);});
    }
    return()=>{clearInterval(timer);styleEl.remove();while(stk.firstChild)stk.removeChild(stk.firstChild);if(dotsEl)dotsEl.innerHTML='';};
  },[]);
  return (
    <div ref={wrapRef} style={{background:bg,borderRadius:bg==='transparent'?0:'16px',padding:'28px 0 20px',margin:'0 0 0 0'}}>
      <div style={{perspective:'600px',perspectiveOrigin:'50% 44%',height:'310px',display:'flex',alignItems:'center',justifyContent:'center',overflow:'visible'}}>
        <div ref={stkRef} style={{position:'relative',width:'170px',height:'210px',transformStyle:'preserve-3d',transform:'rotateX(9deg) rotateY(-24deg)'}}></div>
      </div>
      <div ref={titleRef} style={{textAlign:'center',color:'rgba(255,255,255,0.42)',fontSize:'9.5px',fontWeight:'600',letterSpacing:'1.4px',marginTop:'4px'}}>DASHBOARD</div>
      <div ref={dotsRef} style={{textAlign:'center',marginTop:'13px'}}></div>
    </div>
  );
};

// ── AUTH SCREEN ───────────────────────────────────────────────────────────────
const AuthScreen = ({initialMode='login', onBack=null, onDemo=null}) => {
  const [mode,setMode]=useState(initialMode); // 'login' | 'register' | 'forgot'
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [name,setName]=useState('');
  const [biz,setBiz]=useState('');
  const [err,setErr]=useState('');
  const [ok,setOk]=useState('');
  const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setErr(''); setOk(''); setLoading(true);
    if(mode==='forgot'){
      if(!email){setErr('Please enter your email address.');setLoading(false);return;}
      const {error}=await sb.auth.resetPassword(email);
      if(error){setErr(error.message);}else{setOk('Reset link sent! Check your inbox.');}
      setLoading(false); return;
    }
    if(mode==='register'){
      if(!name||!biz||!email||!pass){setErr('Please fill in all fields.');setLoading(false);return;}
      try{
        const refCode=new URLSearchParams(window.location.search).get('ref')||localStorage.getItem('vg_ref')||null;
        const {error,data:signUpData}=await sb.auth.signUp({email,password:pass,options:{data:{name,businessName:biz,referred_by:refCode}}});
        if(refCode) localStorage.removeItem('vg_ref');
        if(error){setErr(error.message);setLoading(false);return;}
        track('account_created');
        fbqt('CompleteRegistration');
        // If email confirmation is required, no session is returned. Tell the user
        // instead of leaving the button spinning forever.
        if(!signUpData?.session){
          setOk('Account created! Check your inbox to confirm your email, then sign in.');
          setMode('login');setPass('');setLoading(false);return;
        }
        // Otherwise onAuthStateChange will take over and load the app.
      }catch(e){setErr('Sign up failed. Please try again.');setLoading(false);}
    } else {
      if(!email||!pass){setErr('Please fill in all fields.');setLoading(false);return;}
      try{
        const {error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error){setErr(error.message);setPass('');setLoading(false);}
      }catch(e){setErr('Sign in failed. Please try again.');setPass('');setLoading(false);}
    }
  };
  return (
    <div className="relative min-h-screen bg-navy flex flex-col items-center justify-center p-5">
      {onBack&&<button onClick={onBack} className="absolute top-5 left-5 flex items-center gap-1 text-white/40 text-xs">
        <Icon name="back" size={14} color="rgba(255,255,255,0.4)"/> Back
      </button>}
      <img src="/icon-192.png" className="mb-4 shadow-2xl" alt="VanGuard" style={{width:'80px',height:'80px',borderRadius:'20px'}}/>
      <h1 className="text-3xl font-black text-white mb-1">Van<span style={{color:'#0D7377'}}>Guard</span></h1>
      <p className="text-white/40 text-sm mb-8 text-center">Stay compliant. Keep moving.</p>
      <div className="w-full max-w-sm bg-white rounded-2xl p-6 shadow-2xl">
        {mode==='forgot'?(
          <>
            <button onClick={()=>{setMode('login');setErr('');setOk('');}} className="flex items-center gap-1 text-xs text-gray-400 mb-4">
              <Icon name="back" size={14} color="#9CA3AF"/> Back to sign in
            </button>
            <h2 className="font-black text-navy text-lg mb-1">Reset password</h2>
            <p className="text-sm text-gray-400 mb-4">Enter your email and we'll send a reset link.</p>
            <ErrMsg msg={err}/>
            {ok?<OkMsg msg={ok}/>:<>
              <Input label="Email" value={email} onChange={setEmail} type="email" placeholder="you@example.com" required/>
              <Btn onClick={submit} loading={loading}>Send reset link</Btn>
            </>}
          </>
        ):(
          <>
            <div className="flex rounded-xl bg-gray-100 p-1 mb-5">
              {['login','register'].map(m=>(
                <button key={m} onClick={()=>{setMode(m);setErr('');}}
                  className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${mode===m?'bg-white shadow text-navy':'text-gray-400'}`}>
                  {m==='login'?'Sign In':'Free Trial'}
                </button>
              ))}
            </div>
            <ErrMsg msg={err}/>
            {ok&&<OkMsg msg={ok}/>}
            {mode==='register'&&<>
              <Input label="Your name" value={name} onChange={setName} placeholder="Sarah Jones" required/>
              <Input label="Business name" value={biz} onChange={setBiz} placeholder="The Taco Van" required/>
            </>}
            <Input label="Email" value={email} onChange={setEmail} type="email" placeholder="you@example.com" required/>
            <Input label="Password" value={pass} onChange={setPass} type="password" placeholder="Min. 6 characters" required/>
            {mode==='register'&&<p className="text-xs text-gray-400 text-center mb-4">14-day free trial · No card required · Cancel anytime</p>}
            <Btn onClick={submit} loading={loading}>{mode==='register'?'Start Free Trial':'Sign In'}</Btn>
            {mode==='login'&&<button onClick={()=>{setMode('forgot');setErr('');}} className="w-full text-center text-xs text-gray-400 mt-3 py-1">Forgot password?</button>}
            {onDemo&&<button onClick={onDemo} className="w-full text-center text-xs text-gray-400 mt-2 py-1 underline">Just want to look? View the demo</button>}
          </>
        )}
      </div>
      <p className="text-white/25 text-xs mt-6 text-center">Food safety compliance built for mobile caterers · £7.99/month after trial</p>
    </div>
  );
};

const unitTypes=[
  {key:'van',label:'Food Van',emoji:'🚐',desc:'Motorised catering van'},
  {key:'trailer',label:'Trailer',emoji:'🚛',desc:'Towed catering trailer'},
  {key:'gazebo',label:'Gazebo / Stall',emoji:'⛺',desc:'Market stall or tent'},
  {key:'tricycle',label:'Bike / Trike',emoji:'🚲',desc:'Bicycle or tricycle unit'},
];
// Default daily checklists (shared by onboarding + the Daily Diary).
const DEFAULT_OPENING=['Fridge/freezer temps checked','Hand washing station set up','Unit cleaned from previous use','Food stored correctly (covered & separated)'];
const DEFAULT_CLOSING=['Food stored away or safely discarded','Equipment cleaned and put away','All power and gas turned off','Unit secured and locked'];
const DEFAULT_CLEANING=['Work surfaces wiped & sanitised','Chopping boards cleaned','Fridge/freezer wiped inside','Cooking equipment cleaned','Floors swept & mopped','Bins emptied & relined','Hand wash station restocked','Waste disposed correctly'];
// localStorage keys for a user's custom checklist lines (also mirrored to profiles.custom_checklists).
const ckKeys=uid=>({opening:`vg_coj_${uid}`,closing:`vg_cclosej_${uid}`,cleaning:`vg_ccj_${uid}`});
const rmKeys=uid=>({opening:`vg_rmopen_${uid}`,closing:`vg_rmclose_${uid}`,cleaning:`vg_rmclean_${uid}`});
const readCustom=(uid,which)=>{try{return JSON.parse(localStorage.getItem(ckKeys(uid)[which]))||[];}catch{return[];}};
const writeCustom=(uid,which,list)=>{try{localStorage.setItem(ckKeys(uid)[which],JSON.stringify(list));}catch{}};
const readRemoved=(uid,which)=>{try{return JSON.parse(localStorage.getItem(rmKeys(uid)[which]))||[];}catch{return[];}};
const writeRemoved=(uid,which,list)=>{try{localStorage.setItem(rmKeys(uid)[which],JSON.stringify(list));}catch{}};
// Hydrate localStorage from a saved profile so custom checklists follow the user across devices.
const hydrateChecklists=(uid,saved)=>{
  if(!saved||typeof saved!=='object') return;
  ['opening','closing','cleaning'].forEach(which=>{
    if(Array.isArray(saved[which])&&!localStorage.getItem(ckKeys(uid)[which])) writeCustom(uid,which,saved[which]);
    if(saved.removed&&Array.isArray(saved.removed[which])&&!localStorage.getItem(rmKeys(uid)[which])) writeRemoved(uid,which,saved.removed[which]);
  });
};

  return (
    <div className="bg-white rounded-2xl p-4 mb-3">
      <p className="font-bold text-navy text-sm mb-2">{title}</p>
      {defaults.map((item,i)=>{
        const gone=removed.includes(i);
        return (
          <div key={i} className={`flex items-center gap-2 py-1.5 ${gone?'opacity-40':''}`}>
            <div className="w-4 h-4 rounded border-2 border-gray-200 flex-shrink-0"/>
            <span className={`text-sm flex-1 text-gray-700 ${gone?'line-through':''}`}>{item}</span>
            <button onClick={()=>setRemoved(gone?removed.filter(x=>x!==i):[...removed,i])}
              className="text-xs font-semibold flex-shrink-0" style={{color:gone?'#0D7377':'#EF4444'}}>
              {gone?'Add back':'Remove'}
            </button>
          </div>
        );
      })}
      {custom.map(job=>(
        <div key={job.id} className="flex items-center gap-2 py-1.5">
          <div className="w-4 h-4 rounded border-2 border-teal flex-shrink-0"/>
          <span className="text-sm flex-1 text-gray-700">{job.label}</span>
          <button onClick={()=>setCustom(custom.filter(j=>j.id!==job.id))} className="text-gray-300 hover:text-red-400 text-lg leading-none flex-shrink-0">×</button>
        </div>
      ))}
      <div className="flex gap-2 mt-2 pt-2 border-t border-gray-100">
        <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Add your own line…"
          className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:border-teal"/>
        <button onClick={add} disabled={!txt.trim()} className="rounded-xl px-4 py-2 text-sm font-bold text-white disabled:opacity-30" style={{background:'#0D7377'}}>+</button>
      </div>
    </div>
  );
};

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
const Dashboard = ({profile,userId,onNav}) => {
  const [status,setStatus]=useState({diary:false,temps:0,clean:false,van:false});
  const [counts,setCounts]=useState({diaries:0,temps:0});
  const [loading,setLoading]=useState(true);
  const [activity,setActivity]=useState([]);
  const todayStr=today();
  useEffect(()=>{
    const load=async()=>{
      const [{count:dC},{count:tC},{data:tD},{data:tT},{data:tC2},{data:tV},{data:rTemps},{data:rDiary},{data:rClean},{data:rVan},{data:lpgR},{data:wT}]=await Promise.all([
        sb.from('diaries').select('*',{count:'exact',head:true}).eq('user_id',userId),
        sb.from('temp_logs').select('*',{count:'exact',head:true}).eq('user_id',userId),
        sb.from('diaries').select('opening,closing').eq('user_id',userId).eq('date',todayStr),
        sb.from('temp_logs').select('id').eq('user_id',userId).eq('date',todayStr),
        sb.from('cleaning_logs').select('id').eq('user_id',userId).eq('date',todayStr),
        sb.from('van_checks').select('id').eq('user_id',userId).eq('date',todayStr),
        sb.from('temp_logs').select('id,unit,temp,time,pass,created_at,date').eq('user_id',userId).order('created_at',{ascending:false}).limit(6),
        sb.from('diaries').select('date,opening,closing,created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(3),
        sb.from('cleaning_logs').select('id,created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(2),
        sb.from('van_checks').select('id,created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(2),
        sb.from('lpg_logs').select('created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(1),
        sb.from('water_logs').select('id').eq('user_id',userId).eq('date',todayStr),
      ]);
      setCounts({diaries:dC||0,temps:tC||0});
      // Build a merged, time-sorted recent-activity feed from the timestamped record rows.
      const acts=[];
      (rTemps||[]).forEach(t=>acts.push({ok:t.pass!==false,ts:t.created_at||`${t.date}T${t.time||'00:00'}`,text:`${t.unit} ${t.temp}°C`}));
      (rDiary||[]).forEach(d=>{const n=Object.values(d.opening||{}).filter(Boolean).length+Object.values(d.closing||{}).filter(Boolean).length; if(n) acts.push({ok:true,ts:d.created_at||`${d.date}T08:00`,text:'Daily diary updated'});});
      (rClean||[]).forEach(c=>acts.push({ok:true,ts:c.created_at,text:'Cleaning signed off'}));
      (rVan||[]).forEach(v=>acts.push({ok:true,ts:v.created_at,text:'Van & safety check completed'}));
      acts.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
      setActivity(acts.slice(0,6));
      // Diary counts as done only when BOTH opening and closing are complete
      // (mirrors the Diary screen, honouring removed lines and NA items).
      let na={};try{na=JSON.parse(localStorage.getItem('vg_na_diary_'+userId))||{};}catch{}
      const rmO=readRemoved(userId,'opening'),rmC=readRemoved(userId,'closing');
      const d0=tD&&tD[0];
      const openDone=!!d0&&DEFAULT_OPENING.every((_,i)=>rmO.includes(i)||(d0.opening&&d0.opening[i])||na['o'+i]);
      const closeDone=!!d0&&DEFAULT_CLOSING.every((_,i)=>rmC.includes(i)||(d0.closing&&d0.closing[i])||na['c'+i]);
      const lpgRow=lpgR&&lpgR[0];
      const lpgOk=!!lpgRow&&(Date.now()-new Date(lpgRow.created_at))/86400000<=30;
      const waterOk=(wT?.length||0)>0||isNADay(userId,'water');
      setStatus({diary:openDone&&closeDone,diaryOpen:openDone,diaryClose:closeDone,temps:tT?.length||0,clean:!!(tC2?.length),van:!!(tV?.length),lpgOk,waterOk});
      setLoading(false);
    };
    load();
  },[userId]);
  const lpgEnabled=profile?.lpg_enabled!==false;
  const waterEnabled=profile?.water_enabled===true;
  const tasks=[
    {label:'Daily diary completed',done:status.diary,nav:'diary',hint:status.diary?'Opening & closing done':status.diaryOpen?'Closing checks still to do':'Opening checks to do'},
    {label:'Temperature checks',done:status.temps>=2,nav:'temp',hint:`${status.temps}/2 readings today`},
    {label:'Cleaning schedule',done:status.clean,nav:'diary',hint:'Sign off today\'s cleaning'},
    {label:'Van & safety check',done:status.van,nav:'van',hint:'Daily unit inspection'},
  ];
  if(waterEnabled) tasks.push({label:'Water tank log',done:!!status.waterOk,nav:'van',hint:status.waterOk?'Logged or not needed today':'Log it or mark not needed today'});
  if(lpgEnabled) tasks.push({label:'LPG safety check',done:!!status.lpgOk,nav:'van',hint:status.lpgOk?'Current — within 30 days':'Monthly check overdue'});
  const done=tasks.filter(t=>t.done).length;
  const pct=Math.round((done/tasks.length)*100);
  const ringCol=pct===100?'#16a34a':pct>=50?'#f59e0b':'#ef4444';
  const trialDays=profile?.trial_start?Math.floor((new Date()-new Date(profile.trial_start))/86400000):0;
  const trialLeft=Math.max(0,14-trialDays);
  const hour=new Date().getHours();
  const greeting=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  // "Needs attention": outstanding today items, prioritised with time-of-day urgency.
  const attention=[];
  if(!loading){
    if(!status.diaryOpen) attention.push({t:'Opening checks not completed',nav:'diary',urgent:hour>=10});
    if(status.temps===0) attention.push({t:'No temperature logged yet today',nav:'temp',urgent:hour>=11});
    else if(status.temps<2) attention.push({t:`Only ${status.temps} of 2 temperature readings logged`,nav:'temp',urgent:hour>=14});
    if(status.diaryOpen&&!status.diaryClose) attention.push({t:'Closing checks still to do',nav:'diary',urgent:hour>=17});
    if(!status.clean) attention.push({t:'Cleaning not signed off',nav:'diary',urgent:hour>=17});
    if(!status.van) attention.push({t:'Van & safety check not done',nav:'van',urgent:false});
    if(waterEnabled&&!status.waterOk) attention.push({t:'Water tank not logged today',nav:'van',urgent:hour>=14});
    if(lpgEnabled&&!status.lpgOk) attention.push({t:'LPG safety check overdue',nav:'van',urgent:true});
  }
  return (
    <div className="pt-28 pb-8 px-4">
      {/* Hero */}
      <div className="bg-navy rounded-2xl p-5 mb-4 flex items-center gap-4">
        {loading?(
          <div className="w-16 h-16 flex items-center justify-center"><div className="w-6 h-6 border-2 border-white/20 border-t-white rounded-full animate-spin"/></div>
        ):(
          <div className="relative w-16 h-16 flex-shrink-0">
            <svg viewBox="0 0 36 36" className="w-16 h-16 -rotate-90">
              <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="3"/>
              <circle cx="18" cy="18" r="15.9" fill="none" stroke={ringCol} strokeWidth="3"
                strokeDasharray={`${pct} ${100-pct}`} strokeLinecap="round"/>
            </svg>
            <div className="absolute inset-0 flex items-center justify-center">
              <span className="text-white font-black text-sm">{pct}%</span>
            </div>
          </div>
        )}
        <div className="flex-1 min-w-0">
          <p className="text-white/50 text-xs">{greeting},</p>
          <p className="text-white font-bold text-lg leading-tight">{profile?.name?.split(' ')[0]||'there'} 👋</p>
          <p className={`text-sm font-semibold mt-1 ${pct===100?'text-green-400':pct>0?'text-amber-400':'text-white/50'}`}>
            {pct===100?'✓ Today’s checks complete':`${done} of ${tasks.length} checks done today`}
          </p>
          {pct===100&&<p className="text-white/40 text-xs mt-0.5">🛡 Records up to date</p>}
        </div>
        {trialLeft>0&&<Badge label={`${trialLeft}d left`} color="amber"/>}
      </div>
      {/* Needs attention */}
      {attention.length>0&&(
        <>
          <div className="mb-2"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-2">Needs attention</p></div>
          <Card className="divide-y divide-gray-50 mb-5">
            {attention.map((a,i)=>(
              <button key={i} onClick={()=>onNav(a.nav)} className="w-full flex items-center gap-3 px-4 py-3 active:bg-gray-50 text-left">
                <span className="text-base flex-shrink-0 w-5 text-center">{a.urgent?'⚠️':'○'}</span>
                <p className={`flex-1 text-sm font-semibold min-w-0 ${a.urgent?'text-amber-700':'text-gray-700'}`}>{a.t}</p>
                <Icon name="chevron" size={16} color="#CBD5E1"/>
              </button>
            ))}
          </Card>
        </>
      )}
      {/* Today's tasks */}
      <div className="mb-2"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-2">Today's Checks</p></div>
      <Card className="divide-y divide-gray-50 mb-5">
        {tasks.map((t,i)=>(
          <button key={i} onClick={()=>onNav(t.nav)}
            className="w-full flex items-center gap-3 px-4 py-3.5 active:bg-gray-50 text-left">
            <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${t.done?'bg-green-100':'bg-gray-100'}`}>
              {t.done?<Icon name="check" size={15} color="#16a34a"/>:<div className="w-2 h-2 rounded-full bg-gray-300"/>}
            </div>
            <div className="flex-1 min-w-0">
              <p className={`text-sm font-semibold ${t.done?'line-through text-gray-300':'text-gray-800'}`}>{t.label}</p>
              <p className={`text-xs ${t.done?'text-gray-300':'text-gray-400'}`}>{t.hint}</p>
            </div>
            {!t.done&&<Icon name="chevron" size={16} color="#CBD5E1"/>}
          </button>
        ))}
      </Card>
      {/* Recent activity */}
      {activity.length>0&&(
        <>
          <div className="mb-2"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-2">Recent activity</p></div>
          <Card className="divide-y divide-gray-50 mb-5">
            {activity.map((a,i)=>(
              <div key={i} className="flex items-center gap-3 px-4 py-2.5">
                <div className={`w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 ${a.ok?'bg-green-100':'bg-amber-100'}`}>
                  <Icon name="check" size={12} color={a.ok?'#16a34a':'#d97706'}/>
                </div>
                <p className="flex-1 text-sm text-gray-700 min-w-0 truncate">{a.text}</p>
                <span className="text-xs text-gray-400 flex-shrink-0">{fmtWhen(a.ts)}</span>
              </div>
            ))}
          </Card>
        </>
      )}
      {/* Stats */}
      <div className="mb-2"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-2">Your Records</p></div>
      <div className="grid grid-cols-2 gap-3 mb-5">
        <Card className="p-4"><p className="text-2xl font-black text-teal">{counts.diaries}</p><p className="text-xs text-gray-400 mt-0.5">Diary entries</p></Card>
        <Card className="p-4"><p className="text-2xl font-black text-teal">{counts.temps}</p><p className="text-xs text-gray-400 mt-0.5">Temp readings</p></Card>
      </div>
      {/* Records shortcut */}
      <button onClick={()=>onNav('records')} className="w-full bg-navy rounded-2xl p-4 flex items-center gap-3 active:opacity-80">
        <div className="w-10 h-10 bg-teal rounded-xl flex items-center justify-center flex-shrink-0">
          <Icon name="eho" size={20} color="white"/>
        </div>
        <div className="flex-1 text-left">
          <p className="text-white font-bold text-sm">Compliance Records</p>
          <p className="text-white/40 text-xs">Browse history &amp; export EHO pack</p>
        </div>
        <Icon name="chevron" size={18} color="rgba(255,255,255,0.3)"/>
      </button>
    </div>
  );
};
