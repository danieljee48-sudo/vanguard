  const [cleanBy,setCleanBy]=useState(profile?.name||'');
  const [saving,setSaving]=useState(false);
  const [savedD,setSavedD]=useState(false);
  const [savedC,setSavedC]=useState(false);
  const [recent,setRecent]=useState([]);
  const [savedLocations,setSavedLocations]=useState([]);
  const [locationChoice,setLocationChoice]=useState('new');
  const [loading,setLoading]=useState(true);
  const [diaryNA,setDiaryNA]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_na_diary_${userId}`))||{};}catch{return{};}});
  const toggleDiaryNA=key=>{const u={...diaryNA,[key]:!diaryNA[key]};setDiaryNA(u);localStorage.setItem(`vg_na_diary_${userId}`,JSON.stringify(u));};
  const [customCleanJobs,setCustomCleanJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_ccj_${userId}`))||[];}catch{return[];}});
  const [newCleanJob,setNewCleanJob]=useState('');
  const addCleanJob=()=>{if(!newCleanJob.trim())return;const job={id:Date.now().toString(),label:newCleanJob.trim()};const u=[...customCleanJobs,job];setCustomCleanJobs(u);localStorage.setItem(`vg_ccj_${userId}`,JSON.stringify(u));setNewCleanJob('');};
  const removeCleanJob=id=>{const u=customCleanJobs.filter(j=>j.id!==id);setCustomCleanJobs(u);localStorage.setItem(`vg_ccj_${userId}`,JSON.stringify(u));const nc={...cleanChecks};delete nc[`ccj_${id}`];setCleanChecks(nc);};
  const [customOpenJobs,setCustomOpenJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_coj_${userId}`))||[];}catch{return[];}});
  const [newOpenJob,setNewOpenJob]=useState('');
  const addOpenJob=()=>{if(!newOpenJob.trim())return;const job={id:Date.now().toString(),label:newOpenJob.trim()};const u=[...customOpenJobs,job];setCustomOpenJobs(u);localStorage.setItem(`vg_coj_${userId}`,JSON.stringify(u));setNewOpenJob('');};
  const removeOpenJob=id=>{const u=customOpenJobs.filter(j=>j.id!==id);setCustomOpenJobs(u);localStorage.setItem(`vg_coj_${userId}`,JSON.stringify(u));const nc={...opening};delete nc[`coj_${id}`];setOpening(nc);};
  const [customCloseJobs,setCustomCloseJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_cclosej_${userId}`))||[];}catch{return[];}});
  const [newCloseJob,setNewCloseJob]=useState('');
  const addCloseJob=()=>{if(!newCloseJob.trim())return;const job={id:Date.now().toString(),label:newCloseJob.trim()};const u=[...customCloseJobs,job];setCustomCloseJobs(u);localStorage.setItem(`vg_cclosej_${userId}`,JSON.stringify(u));setNewCloseJob('');};
  const removeCloseJob=id=>{const u=customCloseJobs.filter(j=>j.id!==id);setCustomCloseJobs(u);localStorage.setItem(`vg_cclosej_${userId}`,JSON.stringify(u));const nc={...closing};delete nc[`closej_${id}`];setClosing(nc);};
  const openingItems=DEFAULT_OPENING;
  const closingItems=DEFAULT_CLOSING;
  const cleanItems=DEFAULT_CLEANING;
  // Default lines the user removed during onboarding (or later). Treated like "not applicable".
  const rmOpen=readRemoved(userId,'opening');
  const rmClose=readRemoved(userId,'closing');
  const rmClean=readRemoved(userId,'cleaning');
  useEffect(()=>{
    const load=async()=>{
      const [{data:all},{data:cl},{data:locs}]=await Promise.all([
        sb.from('diaries').select('*').eq('user_id',userId).order('date',{ascending:false}).limit(14),
        sb.from('cleaning_logs').select('*').eq('user_id',userId).eq('date',todayStr).maybeSingle(),
        sb.from('saved_locations').select('*').eq('user_id',userId).order('last_used_at',{ascending:false}).limit(50),
      ]);
      const locations=(locs||[]);
      setSavedLocations(locations);
      const td=(all||[]).find(d=>d.date===todayStr);
      if(td){
        const todayLocation=td.location||'';
        setLocation(todayLocation);setOpening(td.opening||{});setClosing(td.closing||{});setIssues(td.issues||'');setSavedD(true);
        const match=locations.find(x=>`${x.name||''}${x.address?`, ${x.address}`:''}`===todayLocation);
        setLocationChoice(match?.id||'new');
      }
      if(cl){setCleanChecks(cl.checks||{});setCleanBy(cl.saved_by||profile?.name||'');setSavedC(true);}
      setRecent((all||[]).filter(d=>d.date!==todayStr).slice(0,7));
      setLoading(false);
    };
    load();
  },[userId]);
  const saveDiary=async()=>{
    setSaving(true);
    await sb.from('diaries').upsert({user_id:userId,date:todayStr,location,opening,closing,issues},{onConflict:'user_id,date'});
    if(location.trim()){
      if(locationChoice!=='new'){
        await sb.from('saved_locations').update({last_used_at:new Date().toISOString()}).eq('id',locationChoice);
      }else{
        const {error:locError}=await sb.from('saved_locations').upsert({user_id:userId,name:location.trim(),address:'',last_used_at:new Date().toISOString()},{onConflict:'user_id,name,address'});
        if(locError) console.warn('Could not save trading location:',locError);
      }
      const {data:locs}=await sb.from('saved_locations').select('*').eq('user_id',userId).order('last_used_at',{ascending:false}).limit(50);
      setSavedLocations(locs||[]);
      const match=(locs||[]).find(x=>`${x.name||''}${x.address?`, ${x.address}`:''}`===location.trim());
      if(match)setLocationChoice(String(match.id));
    }
    setSavedD(true); setSaving(false);
    trackOnce('first_check_'+userId,'first_check_completed');
    window.__vgRefreshCompliance&&window.__vgRefreshCompliance();
  };
  const saveClean=async()=>{
    setSaving(true);
    await sb.from('cleaning_logs').upsert({user_id:userId,date:todayStr,checks:cleanChecks,saved_by:cleanBy},{onConflict:'user_id,date'});
    setSavedC(true); setSaving(false);
    trackOnce('first_check_'+userId,'first_check_completed');
    window.__vgRefreshCompliance&&window.__vgRefreshCompliance();
  };
  const saveEndOfDay=async()=>{
    setSaving(true);
    await Promise.all([
      sb.from('diaries').upsert({user_id:userId,date:todayStr,location,opening,closing,issues},{onConflict:'user_id,date'}),
      sb.from('cleaning_logs').upsert({user_id:userId,date:todayStr,checks:cleanChecks,saved_by:cleanBy},{onConflict:'user_id,date'}),
    ]);
    if(location.trim()){
      if(locationChoice!=='new'){
        await sb.from('saved_locations').update({last_used_at:new Date().toISOString()}).eq('id',locationChoice);
      }else{
        await sb.from('saved_locations').upsert({user_id:userId,name:location.trim(),address:'',last_used_at:new Date().toISOString()},{onConflict:'user_id,name,address'});
      }
      const {data:locs}=await sb.from('saved_locations').select('*').eq('user_id',userId).order('last_used_at',{ascending:false}).limit(50);
      setSavedLocations(locs||[]);
      const match=(locs||[]).find(x=>`${x.name||''}${x.address?`, ${x.address}`:''}`===location.trim());
      if(match)setLocationChoice(String(match.id));
    }
    setSavedD(true);setSavedC(true);setSaving(false);
    trackOnce('first_check_'+userId,'first_check_completed');
    window.__vgRefreshCompliance&&window.__vgRefreshCompliance();
  };
  if(loading) return <div className="pt-28"><Spinner full/></div>;
  const allOpen=openingItems.every((_,i)=>rmOpen.includes(i)||opening[i]||diaryNA['o'+i]);
  const allClose=closingItems.every((_,i)=>rmClose.includes(i)||closing[i]||diaryNA['c'+i]);
  const allClean=cleanItems.every((_,i)=>rmClean.includes(i)||cleanChecks[i]||diaryNA['cl'+i]);
  const tickAllOpen=()=>{const o={...opening};openingItems.forEach((_,i)=>{if(!rmOpen.includes(i))o[i]=true;});customOpenJobs.forEach(j=>{o[`coj_${j.id}`]=true;});setOpening(o);};
  const tickAllClose=()=>{const c={...closing};closingItems.forEach((_,i)=>{if(!rmClose.includes(i))c[i]=true;});customCloseJobs.forEach(j=>{c[`closej_${j.id}`]=true;});setClosing(c);};
  const tickAllClean=()=>{const c={...cleanChecks};cleanItems.forEach((_,i)=>{if(!rmClean.includes(i))c[i]=true;});customCleanJobs.forEach(j=>{c[`ccj_${j.id}`]=true;});setCleanChecks(c);};
  const TickAll=({onClick})=>(<button onClick={onClick} className="text-xs font-bold text-teal active:opacity-60">Tick all</button>);
  return (
    <div className="pt-28 pb-8 px-4">
      <Card className="p-4 mb-4">
        <div className="flex items-center gap-2 mb-3">
          <Icon name="location" size={14} color="#0D7377"/>
          <span className="text-xs font-bold text-teal uppercase tracking-wide">{fmtDate(todayStr)}</span>
          {savedD&&<Badge label="Saved" color="green"/>}
        </div>
        {savedLocations.length>0&&<div className="mb-3">
          <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Previous trading locations</label>
          <select value={locationChoice} onChange={e=>{const v=e.target.value;setLocationChoice(v);if(v!=='new'){const loc=savedLocations.find(x=>String(x.id)===v);if(loc)setLocation(`${loc.name||''}${loc.address?`, ${loc.address}`:''}`);}else setLocation('');}} className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 bg-gray-50 focus:outline-none focus:border-teal focus:bg-white">
            <option value="new">+ Enter a new location</option>
            {savedLocations.map(loc=><option key={loc.id} value={loc.id}>{loc.name}{loc.address?` — ${loc.address}`:''}</option>)}
          </select>
        </div>}
        <Input label="Where are you trading today?" value={location} onChange={v=>{setLocation(v);setLocationChoice('new');}} placeholder="e.g. Borough Market, Stall 12"/>
      </Card>
      {/* Tab selector */}
      <div className="flex rounded-xl bg-gray-100 p-1 mb-4">
        {[{k:'opening',l:'Opening'},{k:'closing',l:'End of Day'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)}
            className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition-all ${tab===t.k?'bg-white shadow text-navy':'text-gray-400'}`}>
            {t.l}
          </button>
        ))}
      </div>
      {tab==='opening'&&(
        <Card className="p-4 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold text-navy text-sm">Opening Checks</h3>
            <div className="flex items-center gap-2">{allOpen?<Badge label="All done" color="green"/>:<TickAll onClick={tickAllOpen}/>}</div>
          </div>
          {openingItems.map((item,i)=>rmOpen.includes(i)?null:(
            <Checkbox key={i} checked={!!opening[i]} onChange={v=>setOpening(p=>({...p,[i]:v}))} label={item} isNA={!!diaryNA['o'+i]} onToggleNA={()=>toggleDiaryNA('o'+i)}/>
          ))}
          {customOpenJobs.map(job=>(
            <div key={job.id} className="flex items-center gap-1">
              <div className="flex-1"><Checkbox checked={!!opening[`coj_${job.id}`]} onChange={v=>setOpening(p=>({...p,[`coj_${job.id}`]:v}))} label={job.label} isNA={!!diaryNA[`coj_${job.id}`]} onToggleNA={()=>toggleDiaryNA(`coj_${job.id}`)}/></div>
              <button onClick={()=>removeOpenJob(job.id)} className="text-gray-300 hover:text-red-400 text-xl leading-none pb-3 flex-shrink-0">×</button>
            </div>
          ))}
          <div className="flex gap-2 mt-3 pt-3 border-t border-gray-100">
            <input value={newOpenJob} onChange={e=>setNewOpenJob(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addOpenJob()} placeholder="Add custom item…" className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:border-teal"/>
            <button onClick={addOpenJob} disabled={!newOpenJob.trim()} className="rounded-xl px-4 py-2 text-sm font-bold text-white disabled:opacity-30" style={{background:'#0D7377'}}>+</button>
          </div>
          <div className="mt-4"><Btn onClick={saveDiary} loading={saving} variant={savedD?'ghost':'primary'}>{savedD?'Apply changes':'Save opening checks'}</Btn></div>
        </Card>
      )}
      {tab==='closing'&&(
        <Card className="p-4 fade-in">
          {/* ── Closing Checks ── */}
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold text-navy text-sm">Closing Checks</h3>
            <div className="flex items-center gap-2">{allClose?<Badge label="Done" color="green"/>:<TickAll onClick={tickAllClose}/>}</div>
          </div>
          {closingItems.map((item,i)=>rmClose.includes(i)?null:(
            <Checkbox key={i} checked={!!closing[i]} onChange={v=>setClosing(p=>({...p,[i]:v}))} label={item} isNA={!!diaryNA['c'+i]} onToggleNA={()=>toggleDiaryNA('c'+i)}/>
          ))}
          {customCloseJobs.map(job=>(
            <div key={job.id} className="flex items-center gap-1">
              <div className="flex-1"><Checkbox checked={!!closing[`closej_${job.id}`]} onChange={v=>setClosing(p=>({...p,[`closej_${job.id}`]:v}))} label={job.label} isNA={!!diaryNA[`closej_${job.id}`]} onToggleNA={()=>toggleDiaryNA(`closej_${job.id}`)}/></div>
              <button onClick={()=>removeCloseJob(job.id)} className="text-gray-300 hover:text-red-400 text-xl leading-none pb-3 flex-shrink-0">×</button>
            </div>
          ))}
          <div className="flex gap-2 mt-3 pt-3 border-t border-gray-100">
            <input value={newCloseJob} onChange={e=>setNewCloseJob(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCloseJob()} placeholder="Add custom check…" className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:border-teal"/>
            <button onClick={addCloseJob} disabled={!newCloseJob.trim()} className="rounded-xl px-4 py-2 text-sm font-bold text-white disabled:opacity-30" style={{background:'#0D7377'}}>+</button>
          </div>
          {/* ── Cleaning Schedule ── */}
          <div className="flex items-center justify-between mt-6 mb-4 pt-5 border-t-2 border-gray-100">
            <h3 className="font-bold text-navy text-sm">Cleaning Schedule</h3>
            <div className="flex items-center gap-2">{allClean?<Badge label="Done" color="green"/>:<TickAll onClick={tickAllClean}/>}</div>
          </div>
          {cleanItems.map((item,i)=>rmClean.includes(i)?null:(
            <Checkbox key={i} checked={!!cleanChecks[i]} onChange={v=>setCleanChecks(p=>({...p,[i]:v}))} label={item} isNA={!!diaryNA['cl'+i]} onToggleNA={()=>toggleDiaryNA('cl'+i)}/>
          ))}
          {customCleanJobs.map(job=>(
            <div key={job.id} className="flex items-center gap-1">
              <div className="flex-1"><Checkbox checked={!!cleanChecks[`ccj_${job.id}`]} onChange={v=>setCleanChecks(p=>({...p,[`ccj_${job.id}`]:v}))} label={job.label} isNA={!!diaryNA[`ccj_${job.id}`]} onToggleNA={()=>toggleDiaryNA(`ccj_${job.id}`)}/></div>
              <button onClick={()=>removeCleanJob(job.id)} className="text-gray-300 hover:text-red-400 text-xl leading-none pb-3 flex-shrink-0">×</button>
            </div>
          ))}
          <div className="flex gap-2 mt-3 pt-3 border-t border-gray-100">
            <input value={newCleanJob} onChange={e=>setNewCleanJob(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCleanJob()} placeholder="Add custom item…" className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:border-teal"/>
            <button onClick={addCleanJob} disabled={!newCleanJob.trim()} className="rounded-xl px-4 py-2 text-sm font-bold text-white disabled:opacity-30" style={{background:'#0D7377'}}>+</button>
          </div>
          {/* ── Notes + sign-off ── */}
          <div className="mt-5 pt-5 border-t border-gray-100">
            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Issues / notes (optional)</label>
            <textarea value={issues} onChange={e=>setIssues(e.target.value)} rows={3} placeholder="Any issues, incidents or actions taken today?"
              className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50 focus:outline-none focus:border-teal resize-none"/>
          </div>
          <div className="mt-3"><Input label="Signed off by" value={cleanBy} onChange={setCleanBy} placeholder="Your name"/></div>
          <Btn onClick={saveEndOfDay} loading={saving} variant={(savedD&&savedC)?'ghost':'primary'}>{(savedD&&savedC)?'Apply changes':'Save end of day'}</Btn>
        </Card>
      )}
      {recent.length>0&&(
        <div className="mt-6">
          <p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-3">Recent Entries</p>
          {recent.map((d,i)=>(
            <Card key={i} className="p-3.5 mb-2 flex items-center gap-3">
              <div className="w-8 h-8 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0">
                <Icon name="check" size={14} color="#16a34a"/>
              </div>
              <div className="flex-1">
                <p className="text-sm font-bold text-navy">{fmtDate(d.date)}</p>
                <p className="text-xs text-gray-400 truncate">{d.location||'No location recorded'}</p>
              </div>
              <span className="text-xs text-gray-300">{fmtDateShort(d.date)}</span>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

// ── TEMPERATURE LOG ───────────────────────────────────────────────────────────
const DEFAULT_APPLIANCES=[
  {id:'a1',name:'Fridge 1',type:'cold',th:8,emoji:'🧊'},
  {id:'a2',name:'Freezer',type:'cold',th:-18,emoji:'❄️'},
  {id:'a3',name:'Hot Hold',type:'hot',th:63,emoji:'🔥'},
];
// Quick-pick corrective actions offered when a reading is out of range.
const CORRECTIVE_OPTIONS=['Moved food to another fridge','Adjusted equipment','Discarded food','Other'];
const applKey=uid=>`vg_appliances_${uid}`;
const loadAppliances=uid=>{try{return JSON.parse(localStorage.getItem(applKey(uid)))||DEFAULT_APPLIANCES;}catch{return DEFAULT_APPLIANCES;}};
const saveAppliances=(uid,list)=>localStorage.setItem(applKey(uid),JSON.stringify(list));

const TempScreen = ({userId}) => {
  const [appliances,setAppliances]=useState(()=>loadAppliances(userId));
  const [temps,setTemps]=useState({});
  const [actions,setActions]=useState({});
  const [corrective,setCorrective]=useState({});
  const [followup,setFollowup]=useState({});
  const [allTemps,setAllTemps]=useState([]);
  const [saving,setSaving]=useState({});
  const [flash,setFlash]=useState({});
  const [editMode,setEditMode]=useState(false);
  const [showAdd,setShowAdd]=useState(false);
  const [renameAppliance,setRenameAppliance]=useState(null);
  const [renameName,setRenameName]=useState('');
  const [newName,setNewName]=useState('');
  const [newType,setNewType]=useState('cold');
  const [newTh,setNewTh]=useState('');
  const [loading,setLoading]=useState(true);
  const todayStr=today();
  const loadTemps=async()=>{const{data}=await sb.from('temp_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(60);setAllTemps(data||[]);setLoading(false);};
  const deleteTemp=async(id)=>{const tok=_getS()?.access_token;await fetch(`${SUPA_URL}/rest/v1/temp_logs?id=eq.${id}`,{method:'DELETE',headers:_h(tok)});await loadTemps();};
  useEffect(()=>{loadTemps();},[userId]);
  const todayTemps=allTemps.filter(t=>t.date===todayStr);

  const logTemp=async(appl)=>{
    const tempVal=temps[appl.id]; if(!tempVal) return;
    const tempNum=parseFloat(tempVal);
    const isPass=appl.type==='hot'?tempNum>=appl.th:tempNum<=appl.th;
    const corr=corrective[appl.id]||'';
    const note=(actions[appl.id]||'').trim();
    // A failed reading must have a corrective action recorded (and a note if "Other").
    if(!isPass){ if(!corr) return; if(corr==='Other'&&!note) return; }
    // Optional follow-up re-check after the corrective action.
    const fuRaw=followup[appl.id];
    let followup_temp=null,followup_time=null,followup_pass=null;
    if(fuRaw!==undefined&&String(fuRaw).trim()!==''&&!isNaN(parseFloat(fuRaw))){
      followup_temp=parseFloat(fuRaw);
      followup_time=nowTime();
      followup_pass=appl.type==='hot'?followup_temp>=appl.th:followup_temp<=appl.th;
    }
    setSaving(p=>({...p,[appl.id]:true}));
    await sb.from('temp_logs').insert({user_id:userId,date:todayStr,time:nowTime(),unit:appl.name,temp:tempNum,type:appl.type,threshold:appl.th,pass:isPass,action:note||null,corrective_action:isPass?null:corr,followup_temp,followup_time,followup_pass});
    await loadTemps();
    setTemps(p=>({...p,[appl.id]:''})); setActions(p=>({...p,[appl.id]:''})); setCorrective(p=>({...p,[appl.id]:''})); setFollowup(p=>({...p,[appl.id]:''}));
    setFlash(p=>({...p,[appl.id]:true})); setTimeout(()=>setFlash(p=>({...p,[appl.id]:false})),2000);
    setSaving(p=>({...p,[appl.id]:false}));
    trackOnce('first_temp_'+userId,'first_temperature_logged');
    window.__vgRefreshCompliance&&window.__vgRefreshCompliance();
  };
  const removeAppliance=id=>{const u=appliances.filter(a=>a.id!==id);setAppliances(u);saveAppliances(userId,u);};
  const startRename=appl=>{setRenameAppliance(appl);setRenameName(appl.name);};
  const saveRename=()=>{
    const name=renameName.trim();
    if(!renameAppliance||!name) return;
    const u=appliances.map(a=>a.id===renameAppliance.id?{...a,name}:a);
    setAppliances(u); saveAppliances(userId,u);
    setRenameAppliance(null); setRenameName('');
  };
  const addAppliance=()=>{
    if(!newName) return;
    const th=newTh?parseFloat(newTh):(newType==='cold'?8:63);
    const emoji=newType==='cold'?'🧊':'🔥';
    const u=[...appliances,{id:Date.now().toString(),name:newName,type:newType,th,emoji}];
    setAppliances(u); saveAppliances(userId,u);
    setNewName(''); setNewTh(''); setShowAdd(false);
  };

  if(loading) return <div className="pt-28"><Spinner full/></div>;
  return (
    <div className="pt-28 pb-8 px-4">
      {/* Status banner */}
      <div className={`rounded-2xl p-4 mb-4 flex items-center gap-3 border ${todayTemps.length>=2?'bg-green-50 border-green-100':'bg-amber-50 border-amber-100'}`}>
        <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${todayTemps.length>=2?'bg-green-100':'bg-amber-100'}`}>
          <span className={`text-lg font-black ${todayTemps.length>=2?'text-green-700':'text-amber-700'}`}>{todayTemps.length}</span>
        </div>
        <div className="flex-1">
          <p className={`font-bold text-sm ${todayTemps.length>=2?'text-green-700':'text-amber-800'}`}>
            {todayTemps.length>=2?'Daily requirement met ✓':`${todayTemps.length} of 2 readings done today`}
          </p>
          <p className={`text-xs ${todayTemps.length>=2?'text-green-500':'text-amber-600'}`}>Need at least 2 readings per day</p>
        </div>
      </div>

      {/* Appliance header + manage button */}
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Log Temperatures</p>
        <button onClick={()=>{setEditMode(p=>!p);setShowAdd(false);setNewName('');setNewTh('');}}
          className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold transition-all ${editMode?'bg-navy text-white':'bg-teal text-white'}`}>
          {editMode?(
            <><span className="text-base leading-none">✓</span> Done</>
          ):(
            <><Icon name="plus" size={14} color="white"/> Add / Remove</>
          )}
        </button>
      </div>

      {appliances.map(appl=>{
        const tempVal=temps[appl.id]||'';
        const tempNum=parseFloat(tempVal);
        const isPass=tempVal?(appl.type==='hot'?tempNum>=appl.th:tempNum<=appl.th):null;
        const flashed=flash[appl.id];
        return (
          <Card key={appl.id} className="p-4 mb-3">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-xl">{appl.emoji}</span>
              <div className="flex-1">
                <p className="font-bold text-navy text-sm">{appl.name}</p>
                <p className="text-xs text-gray-400">{appl.type==='hot'?`Must be ≥${appl.th}°C`:`Must be ≤${appl.th}°C`}</p>
              </div>
              {isPass!==null&&(
                <span className={`text-xs font-bold px-2 py-1 rounded-lg ${isPass?'bg-green-100 text-green-700':'bg-red-100 text-red-600'}`}>{isPass?'PASS':'FAIL'}</span>
              )}
              {editMode&&(
                <div className="flex items-center gap-1 ml-1">
                  <button onClick={()=>startRename(appl)} className="px-2.5 py-1.5 rounded-lg bg-teal-light text-teal text-xs font-bold">Rename</button>
                  <button onClick={()=>removeAppliance(appl.id)} className="w-7 h-7 bg-red-100 rounded-lg flex items-center justify-center" aria-label={`Remove ${appl.name}`}>
                    <span className="text-red-500 font-black text-base leading-none">−</span>
                  </button>
                </div>
              )}
            </div>
            {flashed?<OkMsg msg="✓ Reading saved!"/>:(
              <>
                <div className="flex gap-2">
                  <div className="relative flex-1">
                    <input type="number" value={tempVal} onChange={e=>setTemps(p=>({...p,[appl.id]:e.target.value}))} placeholder="0"
                      className="w-full border border-gray-200 rounded-xl px-4 py-3 text-2xl font-black bg-gray-50 focus:outline-none focus:border-teal pr-10"/>
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-sm">°C</span>
                  </div>
                  <button onClick={()=>logTemp(appl)} disabled={!tempVal||saving[appl.id]||(isPass===false&&(!corrective[appl.id]||(corrective[appl.id]==='Other'&&!(actions[appl.id]||'').trim())))}
                    className={`px-6 rounded-xl font-bold text-sm transition-all flex items-center gap-1 ${tempVal&&!(isPass===false&&(!corrective[appl.id]||(corrective[appl.id]==='Other'&&!(actions[appl.id]||'').trim())))?'bg-teal text-white':'bg-gray-100 text-gray-400'}`}>
                    {saving[appl.id]?<div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"/>:'Log'}
                  </button>
                </div>
                {tempVal&&isPass===false&&(
                  <div className="mt-3 rounded-xl bg-red-50 border border-red-200 p-3">
                    <p className="text-sm font-bold text-red-700">{tempNum}°C — outside safe range</p>
                    <p className="text-xs text-red-500 mt-0.5 mb-2">What action did you take? <span className="font-semibold">(required)</span></p>
                    <div className="flex flex-wrap gap-1.5 mb-2">
                      {CORRECTIVE_OPTIONS.map(opt=>(
                        <button key={opt} onClick={()=>setCorrective(p=>({...p,[appl.id]:opt}))}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${corrective[appl.id]===opt?'bg-red-600 text-white border-red-600':'bg-white text-red-600 border-red-200 active:bg-red-100'}`}>{opt}</button>
                      ))}
                    </div>
                    <textarea value={actions[appl.id]||''} onChange={e=>setActions(p=>({...p,[appl.id]:e.target.value}))} rows={2}
                      placeholder={corrective[appl.id]==='Other'?'Describe the action taken (required)…':'Add a note (optional)…'}
                      className="w-full border border-red-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none resize-none"/>
                    <label className="block text-xs font-semibold text-red-500 mt-2 mb-1">Follow-up reading after action (optional)</label>
                    <div className="relative">
                      <input type="number" value={followup[appl.id]||''} onChange={e=>setFollowup(p=>({...p,[appl.id]:e.target.value}))} placeholder="Re-checked temperature"
                        className="w-full border border-red-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none pr-9"/>
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-red-300 text-xs font-bold">°C</span>
                    </div>
                  </div>
                )}
              </>
            )}
          </Card>
        );
      })}

      {/* Inline add form — shown in edit mode */}
      {editMode&&(
        <Card className="p-4 mb-3 border-2 border-teal/30 fade-in">
          <p className="text-xs font-bold text-teal uppercase tracking-wide mb-3">Add New Appliance</p>
          <div className="grid grid-cols-3 gap-2 mb-3">
            {[{label:'Fridge',type:'cold',th:8,emoji:'🧊'},{label:'Freezer',type:'cold',th:-18,emoji:'❄️'},{label:'Hot Hold',type:'hot',th:63,emoji:'🔥'}].map(p=>(
              <button key={p.label} onClick={()=>{setNewName(p.label);setNewType(p.type);setNewTh(String(p.th));}}
                className={`py-2.5 rounded-xl border-2 text-xs font-semibold text-center transition-all ${newName===p.label?'bg-teal border-teal text-white':'bg-gray-50 border-gray-100 text-gray-600'}`}>
                <div className="text-lg">{p.emoji}</div><div>{p.label}</div>
              </button>
            ))}
          </div>
          <Input label="Name" value={newName} onChange={setNewName} placeholder="e.g. Fridge 2, Prep Fridge"/>
          <div className="grid grid-cols-2 gap-3 mb-3">
            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Type</label>
              <div className="flex gap-2">
                {[{v:'cold',l:'Cold'},{v:'hot',l:'Hot'}].map(o=>(
                  <button key={o.v} onClick={()=>setNewType(o.v)}
                    className={`flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition-all ${newType===o.v?'bg-teal border-teal text-white':'bg-gray-50 border-gray-100 text-gray-600'}`}>{o.l}</button>
                ))}
              </div>
            </div>
            <Input label="Safe limit (°C)" value={newTh} onChange={setNewTh} type="number" placeholder={newType==='cold'?'8':'63'}/>
          </div>
          <Btn onClick={addAppliance} disabled={!newName} size="sm">+ Add appliance</Btn>
        </Card>
      )}

      {renameAppliance&&(
        <div className="fixed inset-0 z-[120] bg-navy/60 flex items-end sm:items-center justify-center p-4" onMouseDown={e=>{if(e.target===e.currentTarget){setRenameAppliance(null);setRenameName('');}}}>
          <div className="w-full max-w-md bg-white rounded-2xl p-5 shadow-2xl" role="dialog" aria-modal="true" aria-label="Rename appliance">
            <div className="flex items-center justify-between mb-1">
              <h3 className="font-black text-navy text-lg">Rename appliance</h3>
              <button onClick={()=>{setRenameAppliance(null);setRenameName('');}} className="w-9 h-9 rounded-xl bg-gray-100 text-gray-500 text-xl" aria-label="Close">×</button>
            </div>
            <p className="text-xs text-gray-400 mb-4">Save the new name before entering a temperature.</p>
            <input autoFocus inputMode="text" value={renameName} onChange={e=>setRenameName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveRename();}} className="w-full border border-gray-200 rounded-xl px-4 py-3 text-base bg-gray-50 focus:outline-none focus:border-teal focus:bg-white" placeholder="e.g. Main Fridge"/>
            <div className="flex gap-2 mt-4">
              <button onClick={()=>{setRenameAppliance(null);setRenameName('');}} className="flex-1 py-3 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600">Cancel</button>
              <button onClick={saveRename} disabled={!renameName.trim()} className="flex-1 py-3 rounded-xl bg-teal text-white text-sm font-bold disabled:opacity-40">Save name</button>
            </div>
          </div>
        </div>
      )}

      {/* Today's readings */}
      {todayTemps.length>0&&(
        <>
          <p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-3">Today's Readings</p>
          {todayTemps.map((t,i)=>(
            <Card key={i} className="p-3.5 mb-2 flex items-center gap-3">
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 ${t.pass?'bg-green-100':'bg-red-100'}`}>
                <Icon name={t.pass?'check':'warn'} size={14} color={t.pass?'#16a34a':'#dc2626'}/>
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold text-navy">{t.unit}</p>
                <p className="text-xs text-gray-400">{t.time} · {t.temp}°C</p>
                {t.corrective_action&&<p className="text-xs text-red-600 mt-0.5">Action: {t.corrective_action}{t.action?` — ${t.action}`:''}</p>}
                {t.followup_temp!=null&&<p className={`text-xs mt-0.5 ${t.followup_pass?'text-green-600':'text-red-600'}`}>Re-checked {t.followup_temp}°C{t.followup_time?` at ${t.followup_time}`:''} · {t.followup_pass?'back in range ✓':'still out of range'}</p>}
              </div>
              <span className={`text-xs font-bold px-2 py-1 rounded-lg flex-shrink-0 ${t.pass?'bg-green-100 text-green-700':'bg-red-100 text-red-600'}`}>{t.pass?'PASS':'FAIL'}</span>
              <button onClick={()=>{if(window.confirm('Delete this reading?'))deleteTemp(t.id);}} className="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center active:bg-red-100 flex-shrink-0 ml-1" title="Delete reading">
                <span className="text-gray-400 text-sm font-bold leading-none">×</span>
              </button>
            </Card>
          ))}
        </>
      )}
      {allTemps.filter(t=>t.date!==todayStr).length>0&&(
        <>
          <p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mt-5 mb-3">Previous</p>
          {allTemps.filter(t=>t.date!==todayStr).slice(0,10).map((t,i)=>(
            <Card key={i} className="p-3 mb-2 flex items-center gap-3">
              <div className={`w-6 h-6 rounded-lg flex items-center justify-center flex-shrink-0 ${t.pass?'bg-green-100':'bg-red-100'}`}>
                <Icon name={t.pass?'check':'warn'} size={12} color={t.pass?'#16a34a':'#dc2626'}/>
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-xs font-semibold text-navy">{t.unit} · {t.temp}°C · {t.time}</p>
                <p className="text-xs text-gray-400">{fmtDate(t.date)}</p>
                {t.corrective_action&&<p className="text-xs text-red-500 truncate">Action: {t.corrective_action}{t.followup_temp!=null?` · re-checked ${t.followup_temp}°C`:''}</p>}
              </div>
              <span className={`text-xs font-bold ${t.pass?'text-green-600':'text-red-500'}`}>{t.pass?'PASS':'FAIL'}</span>
            </Card>
          ))}
        </>
      )}
    </div>
  );
};

// ── VAN & SAFETY ──────────────────────────────────────────────────────────────
const VanScreen = ({userId,profile}) => {
  const [tab,setTab]=useState('vehicle');
  const showLPG=profile?.lpg_enabled!==false;
  const showWater=profile?.water_enabled===true;
  const todayStr=today();
  const [saving,setSaving]=useState(false);
  const [vChecks,setVChecks]=useState({});
  const [vBy,setVBy]=useState(profile?.name||'');
  const [vSaved,setVSaved]=useState(false);
  const [lpgRecs,setLpgRecs]=useState([]);
  const [lpg,setLpg]=useState({hose:false,regulator:false,flame:false,no_leaks:false});
  const [lpgNotes,setLpgNotes]=useState('');
  const [lpgFlash,setLpgFlash]=useState(false);
  const [waterRecs,setWaterRecs]=useState([]);
  const [water,setWater]=useState({filled:false,cleaned:false,sanitised:false});
  const [waterNAToday,setWaterNAToday]=useState(()=>isNADay(userId,'water'));
  const markWaterNA=(val)=>{setNADayFlag(userId,'water',val);setWaterNAToday(val);window.__vgRefreshCompliance&&window.__vgRefreshCompliance();};
  const [waterFlash,setWaterFlash]=useState(false);
  const [pitches,setPitches]=useState([]);
  const [pitchName,setPitchName]=useState('');
  const [pitchAddr,setPitchAddr]=useState('');
  const [pitchFlash,setPitchFlash]=useState(false);
  const [loading,setLoading]=useState(true);
  const [vanNA,setVanNA]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_na_van_${userId}`))||{};}catch{return{};}});
  const toggleVanNA=key=>{const u={...vanNA,[key]:!vanNA[key]};setVanNA(u);localStorage.setItem(`vg_na_van_${userId}`,JSON.stringify(u));};
  const [customVanJobs,setCustomVanJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_cvj_${userId}`))||[];}catch{return[];}});
  const [newVanJob,setNewVanJob]=useState('');
  const addVanJob=()=>{if(!newVanJob.trim())return;const job={id:Date.now().toString(),label:newVanJob.trim()};const u=[...customVanJobs,job];setCustomVanJobs(u);localStorage.setItem(`vg_cvj_${userId}`,JSON.stringify(u));setNewVanJob('');};
  const removeVanJob=id=>{const u=customVanJobs.filter(j=>j.id!==id);setCustomVanJobs(u);localStorage.setItem(`vg_cvj_${userId}`,JSON.stringify(u));const nc={...vChecks};delete nc[`cvj_${id}`];setVChecks(nc);};
  const [customLpgJobs,setCustomLpgJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_clpgj_${userId}`))||[];}catch{return[];}});
  const [customLpgChecks,setCustomLpgChecks]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_clpgchecks_${userId}`))||{};}catch{return{};}});
  const [newLpgJob,setNewLpgJob]=useState('');
  const addLpgJob=()=>{if(!newLpgJob.trim())return;const job={id:Date.now().toString(),label:newLpgJob.trim()};const u=[...customLpgJobs,job];setCustomLpgJobs(u);localStorage.setItem(`vg_clpgj_${userId}`,JSON.stringify(u));setNewLpgJob('');};
  const removeLpgJob=id=>{const u=customLpgJobs.filter(j=>j.id!==id);setCustomLpgJobs(u);localStorage.setItem(`vg_clpgj_${userId}`,JSON.stringify(u));const nc={...customLpgChecks};delete nc[id];setCustomLpgChecks(nc);localStorage.setItem(`vg_clpgchecks_${userId}`,JSON.stringify(nc));};
  const toggleLpgCheck=(id,v)=>{const nc={...customLpgChecks,[id]:v};setCustomLpgChecks(nc);localStorage.setItem(`vg_clpgchecks_${userId}`,JSON.stringify(nc));};
  const [customWaterJobs,setCustomWaterJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_cwj_${userId}`))||[];}catch{return[];}});
  const [customWaterChecks,setCustomWaterChecks]=useState(()=>{try{return JSON.parse(localStorage.getItem(`vg_cwchecks_${userId}`))||{};}catch{return{};}});
  const [newWaterJob,setNewWaterJob]=useState('');
  const addWaterJob=()=>{if(!newWaterJob.trim())return;const job={id:Date.now().toString(),label:newWaterJob.trim()};const u=[...customWaterJobs,job];setCustomWaterJobs(u);localStorage.setItem(`vg_cwj_${userId}`,JSON.stringify(u));setNewWaterJob('');};
  const removeWaterJob=id=>{const u=customWaterJobs.filter(j=>j.id!==id);setCustomWaterJobs(u);localStorage.setItem(`vg_cwj_${userId}`,JSON.stringify(u));const nc={...customWaterChecks};delete nc[id];setCustomWaterChecks(nc);localStorage.setItem(`vg_cwchecks_${userId}`,JSON.stringify(nc));};
  const toggleWaterCheck=(id,v)=>{const nc={...customWaterChecks,[id]:v};setCustomWaterChecks(nc);localStorage.setItem(`vg_cwchecks_${userId}`,JSON.stringify(nc));};
  const vehicleItems=['Unit is clean and ready for service',showLPG?'Gas connections checked — no leaks':'Electrical connections checked','Fire extinguisher present and accessible','First aid kit stocked and accessible','Hand washing station set up and stocked','Food at correct temperatures','All equipment safely stored','Waste disposal set up'];
  useEffect(()=>{
    const load=async()=>{
      const [{data:vc},{data:lR},{data:wR},{data:pR}]=await Promise.all([
        sb.from('van_checks').select('*').eq('user_id',userId).eq('date',todayStr).maybeSingle(),
        sb.from('lpg_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(5),
        sb.from('water_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(3),
        sb.from('pitch_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(20),
      ]);
      if(vc){setVChecks(vc.checks||{});setVBy(vc.signed_by||profile?.name||'');setVSaved(true);}
      setLpgRecs(lR||[]); setWaterRecs(wR||[]); setPitches(pR||[]);
      setLoading(false);
    };
    load();
  },[userId]);
  const saveVehicle=async()=>{setSaving(true);await sb.from('van_checks').upsert({user_id:userId,date:todayStr,checks:vChecks,signed_by:vBy},{onConflict:'user_id,date'});setVSaved(true);setSaving(false);trackOnce('first_check_'+userId,'first_check_completed');window.__vgRefreshCompliance&&window.__vgRefreshCompliance();};
  const saveLPG=async()=>{
    if(!Object.values(lpg).every(Boolean)) return;
    setSaving(true);
    const{error}=await sb.from('lpg_logs').insert({user_id:userId,date:todayStr,...lpg,notes:lpgNotes});
    if(error){ setSaving(false); alert('Could not save the LPG check: '+(error.message||'please try again.')); return; }
    const{data}=await sb.from('lpg_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(5);
    setLpgRecs(data||[]); setLpgFlash(true); setTimeout(()=>setLpgFlash(false),2000); setSaving(false);
    window.__vgRefreshCompliance&&window.__vgRefreshCompliance();
  };
  const saveWater=async()=>{
    setSaving(true);
    const{error}=await sb.from('water_logs').insert({user_id:userId,date:todayStr,...water});
    if(error){ setSaving(false); alert('Could not save the water log: '+(error.message||'please try again.')); return; }
    const{data}=await sb.from('water_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(3);
    setWaterRecs(data||[]); setWaterFlash(true); setTimeout(()=>setWaterFlash(false),2000); setSaving(false);
    setNADayFlag(userId,'water',false); setWaterNAToday(false);
    window.__vgRefreshCompliance&&window.__vgRefreshCompliance();
  };
  const savePitch=async()=>{
    if(!pitchName) return;
    setSaving(true);
    await sb.from('pitch_logs').insert({user_id:userId,date:todayStr,name:pitchName,address:pitchAddr});
    await sb.from('saved_locations').upsert({user_id:userId,name:pitchName.trim(),address:pitchAddr.trim()||'',last_used_at:new Date().toISOString()},{onConflict:'user_id,name,address'});
    const{data}=await sb.from('pitch_logs').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(20);
    setPitches(data||[]); setPitchFlash(true); setTimeout(()=>setPitchFlash(false),2000); setPitchName(''); setPitchAddr(''); setSaving(false);
  };
  const lastLPG=lpgRecs[0];
  const lpgDays=lastLPG?Math.floor((new Date()-new Date(lastLPG.created_at))/86400000):null;
  const lpgDue=!lastLPG||lpgDays>30;
  const tabs=[{k:'vehicle',l:'Unit'},{k:'lpg',l:'LPG'},{k:'water',l:'Water'},{k:'pitch',l:'Pitch'}].filter(t=>(t.k!=='lpg'||showLPG)&&(t.k!=='water'||showWater));
  if(loading) return <div className="pt-28"><Spinner full/></div>;
  return (
    <div className="pt-28 pb-8 px-4">
      <div className={`flex rounded-xl bg-gray-100 p-1 mb-4`}>
        {tabs.map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)}
            className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition-all ${tab===t.k?'bg-white shadow text-navy':'text-gray-400'}`}>
            {t.l}
          </button>
        ))}
      </div>
      {tab==='vehicle'&&(
        <Card className="p-4 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-bold text-navy text-sm">Daily Unit Check</h3>
            <button onClick={()=>{const c={...vChecks};vehicleItems.forEach((_,i)=>{c[i]=true;});customVanJobs.forEach(j=>{c[`cvj_${j.id}`]=true;});setVChecks(c);}} className="text-xs font-bold text-teal active:opacity-60">Tick all</button>
          </div>
          {vehicleItems.map((item,i)=>(
            <Checkbox key={i} checked={!!vChecks[i]} onChange={v=>setVChecks(p=>({...p,[i]:v}))} label={item} isNA={!!vanNA['v'+i]} onToggleNA={()=>toggleVanNA('v'+i)}/>
          ))}
          {customVanJobs.map(job=>(
            <div key={job.id} className="flex items-center gap-1">
              <div className="flex-1"><Checkbox checked={!!vChecks[`cvj_${job.id}`]} onChange={v=>setVChecks(p=>({...p,[`cvj_${job.id}`]:v}))} label={job.label} isNA={!!vanNA[`cvj_${job.id}`]} onToggleNA={()=>toggleVanNA(`cvj_${job.id}`)}/></div>
              <button onClick={()=>removeVanJob(job.id)} className="text-gray-300 hover:text-red-400 text-xl leading-none pb-3 flex-shrink-0">×</button>
            </div>
          ))}
          <div className="flex gap-2 mt-3 pt-3 border-t border-gray-100">
            <input value={newVanJob} onChange={e=>setNewVanJob(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addVanJob()} placeholder="Add custom check…" className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:border-teal"/>
            <button onClick={addVanJob} disabled={!newVanJob.trim()} className="rounded-xl px-4 py-2 text-sm font-bold text-white disabled:opacity-30" style={{background:'#0D7377'}}>+</button>
          </div>
          <div className="mt-4"><Input label="Checked by" value={vBy} onChange={setVBy} placeholder="Your name"/></div>
          <Btn onClick={saveVehicle} loading={saving} variant={vSaved?'ghost':'primary'}>{vSaved?'Apply changes':'Save unit check'}</Btn>
        </Card>
      )}
      {tab==='lpg'&&showLPG&&(
        <div className="fade-in">
          <div className={`rounded-2xl p-4 mb-4 flex items-start gap-3 border ${lpgDue?'bg-amber-50 border-amber-200':'bg-green-50 border-green-100'}`}>
            <Icon name={lpgDue?'warn':'check'} size={18} color={lpgDue?'#d97706':'#16a34a'}/>
            <div>
              <p className={`font-bold text-sm ${lpgDue?'text-amber-800':'text-green-700'}`}>
                {!lastLPG?'No LPG check on record':lpgDue?`Overdue — last checked ${lpgDays} days ago`:`Checked ${lpgDays}d ago — next in ${30-lpgDays}d`}
              </p>

      const cs=getCutoff(period);

      const mq=(t)=>ar(sb.from(t).select('*',{count:'exact',head:true}).eq('user_id',userId));
      const [dC,tC,cC,vC,lC,wC,pC,allT,tD,tT,tCl,tV]=await Promise.all([
        mq('diaries'),mq('temp_logs'),mq('cleaning_logs'),mq('van_checks'),

        sb.from('temp_logs').select('id').eq('user_id',userId).eq('date',todayStr),

      const passing=(allT.data||[]).filter(t=>t.pass).length;
      setPassRate(allT.data?.length?Math.round((passing/allT.data.length)*100):0);
      // Diary counts as done only when BOTH opening and closing are complete.
      let na={};try{na=JSON.parse(localStorage.getItem('vg_na_diary_'+userId))||{};}catch{}
      const rmO=readRemoved(userId,'opening'),rmC=readRemoved(userId,'closing');

      const done=[openDone&&closeDone,!!(tT.data?.length>=2),!!(tCl.data?.length),!!(tV.data?.length)].filter(Boolean).length;
      setTodayPct(Math.round((done/4)*100));

// ── FEEDBACK PROMPT (star rating, shown once after a fully-compliant day) ──────
const FeedbackPrompt = ({userId,email,onClose}) => {
  const [rating,setRating]=useState(0);
  const [hover,setHover]=useState(0);
  const [msg,setMsg]=useState('');
  const [sending,setSending]=useState(false);
  const [done,setDone]=useState(false);
  const happy=rating>=4;
  const submit=async()=>{
    if(!rating) return;
    setSending(true);
    try{ await sb.from('feedback').insert({user_id:userId,email,message:msg.trim()||null,rating}); }catch{}
    track('feedback_submitted',{rating});
    try{ localStorage.setItem('vg_fb_done_'+userId,'1'); }catch{}
    setSending(false); setDone(true);
  };
  const dismiss=()=>{ try{ localStorage.setItem('vg_fb_snooze_'+userId,String(Date.now())); }catch{} onClose(); };
  return (
    <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center px-4 pb-6 sm:pb-0" style={{background:'rgba(10,16,30,0.55)'}} onClick={dismiss}>
      <div className="w-full max-w-sm bg-white rounded-2xl p-5 shadow-2xl fade-in" onClick={e=>e.stopPropagation()}>
        {!done?(<>
          <div className="flex items-start justify-between">
            <div>
              <p className="font-black text-navy text-lg leading-tight">Nice work — fully compliant today! 🎉</p>
              <p className="text-sm text-gray-500 mt-1">How's VanGuard working out for you?</p>
            </div>
            <button onClick={dismiss} aria-label="Close" className="text-gray-300 text-2xl leading-none flex-shrink-0 ml-2">×</button>
          </div>
          <div className="flex justify-center gap-2 my-5">
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>setRating(n)} onMouseEnter={()=>setHover(n)} onMouseLeave={()=>setHover(0)}
                className="transition-transform active:scale-90" aria-label={`${n} star${n>1?'s':''}`}>
                <span style={{fontSize:'34px',lineHeight:1,filter:(hover||rating)>=n?'none':'grayscale(1)',opacity:(hover||rating)>=n?1:0.35,transition:'all .15s'}}>⭐</span>
              </button>
            ))}
          </div>
          {rating>0&&(
            <textarea value={msg} onChange={e=>setMsg(e.target.value)} rows={3}
              placeholder={happy?'Anything you love, or that could be even better? (optional)':'Sorry to hear that — what would make it better?'}
              className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50 focus:outline-none focus:border-teal resize-none mb-3"/>
          )}
          <Btn onClick={submit} loading={sending} disabled={!rating}>Send feedback</Btn>
        </>):(happy&&GOOGLE_REVIEW_URL?(
          <div className="text-center py-2">
            <p className="text-4xl mb-2">🙌</p>
            <p className="font-black text-navy text-lg">Thank you!</p>
            <p className="text-sm text-gray-500 mt-1 mb-4">Would you mind leaving a quick Google review? It genuinely helps other caterers find us.</p>
            <a href={GOOGLE_REVIEW_URL} target="_blank" rel="noopener noreferrer" onClick={onClose}
              className="block w-full py-3 rounded-xl font-bold text-white text-sm mb-2" style={{background:'#0D7377'}}>Leave a Google review</a>
            <button onClick={onClose} className="text-xs text-gray-400 font-semibold py-1">No thanks</button>
          </div>
        ):(
          <div className="text-center py-2">
            <p className="text-4xl mb-2">🙏</p>
            <p className="font-black text-navy text-lg">Thanks for the feedback</p>
            <p className="text-sm text-gray-500 mt-1 mb-4">{happy?"Really glad it's working for you.":'We read every message and will use this to make VanGuard better.'}</p>
            <button onClick={onClose} className="block w-full py-3 rounded-xl font-bold text-white text-sm" style={{background:'#0D7377'}}>Close</button>
          </div>
        ))}
      </div>
    </div>
  );
};

// ── DOCUMENTS ─────────────────────────────────────────────────────────────────
const DOCUMENT_CATEGORIES=['Food Safety','Insurance','Training','Allergens','Gas / LPG','Equipment','Other'];
const DOCUMENT_BUCKET='vanguard-documents';
const DocumentsScreen=({userId})=>{
  const [docs,setDocs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [uploading,setUploading]=useState(false);
  const [category,setCategory]=useState('Food Safety');
  const [error,setError]=useState('');
  const loadDocs=async()=>{
    setLoading(true); setError('');
    const {data,error}=await sb.from('documents').select('*').eq('user_id',userId).order('created_at',{ascending:false});
    if(error)setError(error.message); else setDocs(data||[]);
    setLoading(false);
  };
  useEffect(()=>{loadDocs();},[userId]);
  const upload=async(e)=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file)return;
    if(window.__vgDemo){alert('Document uploads are available on a live VanGuard account.');return;}
    if(file.size>15*1024*1024){setError('Files must be 15MB or smaller.');return;}
    setUploading(true); setError('');
    try{
      const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      const safeName=file.name.replace(/[^a-zA-Z0-9._ -]/g,'').replace(/\s+/g,'-').slice(0,100)||`document.${ext}`;
      const path=`${userId}/${crypto.randomUUID()}-${safeName}`;
      const {error:upErr}=await sb.storage.from(DOCUMENT_BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
      if(upErr)throw upErr;
      const {error:rowErr}=await sb.from('documents').insert({user_id:userId,name:file.name,category,path,mime_type:file.type||null,size_bytes:file.size});
      if(rowErr){
        // If the metadata insert fails after the file upload, clean up the orphaned file.
        await sb.storage.from(DOCUMENT_BUCKET).remove([path]).catch(()=>{});
        throw rowErr;
      }
      await loadDocs();
    }catch(err){setError(err.message||'Could not upload document.');}
    finally{setUploading(false);}
  };
  const openDoc=async(doc)=>{
    const {data,error}=await sb.storage.from(DOCUMENT_BUCKET).createSignedUrl(doc.path,300);
    if(error||!data?.signedUrl){setError(error?.message||'Could not open document.');return;}
    window.open(data.signedUrl,'_blank','noopener,noreferrer');
  };
  const removeDoc=async(doc)=>{
    if(!window.confirm(`Delete "${doc.name}"?`))return;
    setError('');
    const {error:storageErr}=await sb.storage.from(DOCUMENT_BUCKET).remove([doc.path]);
    if(storageErr){setError(storageErr.message);return;}
    const {error:rowErr}=await sb.from('documents').delete().eq('id',doc.id).eq('user_id',userId);
    if(rowErr){setError(rowErr.message);return;}
    setDocs(p=>p.filter(d=>d.id!==doc.id));
  };
  const fmtSize=n=>{if(!n)return ''; if(n<1024*1024)return `${Math.round(n/1024)} KB`; return `${(n/1024/1024).toFixed(1)} MB`;};
  return <div className="pt-28 pb-8 px-4">
    <div className="mb-5">
      <p className="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mb-1">Documents</p>
      <h2 className="text-2xl font-black text-navy">Your compliance documents</h2>
      <p className="text-sm text-gray-500 mt-1">Keep certificates, policies and other EHO paperwork securely in one place.</p>
    </div>
    <Card className="p-4 mb-4">
      <div className="flex items-center gap-3 mb-4">
        <div className="w-10 h-10 bg-teal-light rounded-xl flex items-center justify-center"><Icon name="folder" size={18} color="#0D7377"/></div>
        <div><p className="font-bold text-navy text-sm">Upload a document</p><p className="text-xs text-gray-400">PDF, JPG, PNG or other files up to 15MB</p></div>
      </div>
      <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Category</label>
      <select value={category} onChange={e=>setCategory(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50 mb-3 focus:outline-none focus:border-teal">
        {DOCUMENT_CATEGORIES.map(c=><option key={c}>{c}</option>)}
      </select>
      <label className={`w-full py-3.5 rounded-xl bg-teal text-white font-semibold text-sm flex items-center justify-center gap-2 cursor-pointer ${uploading?'opacity-50 pointer-events-none':''}`}>
        {uploading?<><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"/> Uploading…</>:<><Icon name="plus" size={16} color="white"/> Choose file</>}
        <input type="file" className="hidden" onChange={upload}/>
      </label>
      <ErrMsg msg={error}/>
    </Card>
    {loading?<Spinner/>:docs.length===0?<Card className="p-6 text-center"><div className="w-12 h-12 bg-gray-100 rounded-2xl mx-auto flex items-center justify-center mb-3"><Icon name="folder" size={22} color="#9CA3AF"/></div><p className="font-bold text-navy text-sm">No documents yet</p><p className="text-xs text-gray-400 mt-1">Upload your insurance, food safety, training and equipment certificates here.</p></Card>:
      <div>{docs.map(doc=><Card key={doc.id} className="p-3.5 mb-2 flex items-center gap-3">
        <div className="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center flex-shrink-0"><Icon name="folder" size={18} color="#64748B"/></div>
        <div className="flex-1 min-w-0"><p className="text-sm font-bold text-navy truncate">{doc.name}</p><p className="text-xs text-gray-400">{doc.category}{doc.size_bytes?` · ${fmtSize(doc.size_bytes)}`:''}</p></div>
        <button onClick={()=>openDoc(doc)} className="px-2.5 py-1.5 rounded-lg bg-teal-light text-teal text-xs font-bold">Open</button>
        <button onClick={()=>removeDoc(doc)} className="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center" aria-label={`Delete ${doc.name}`}><Icon name="trash" size={15} color="#DC2626"/></button>
      </Card>)}</div>}
  </div>;
};

// ── ACCOUNT ───────────────────────────────────────────────────────────────────
const AccountScreen = ({userId,profile,onUpdate}) => {
  const [section,setSection]=useState('profile');
  const [name,setName]=useState(profile?.name||'');
  const [biz,setBiz]=useState(profile?.business_name||'');
  const [unitType,setUnitType]=useState(profile?.unit_type||'van');
  const [authority,setAuthority]=useState(profile?.authority||'');
  const [lpgEnabled,setLpgEnabled]=useState(profile?.lpg_enabled!==false);
  const [waterEnabled,setWaterEnabled]=useState(profile?.water_enabled??false);
  const [teamSize,setTeamSize]=useState(profile?.team_size||'solo');
  const [foodType,setFoodType]=useState(profile?.food_type||'');
  const [hygieneRating,setHygieneRating]=useState(profile?.hygiene_rating??null);
  // Keep the form in sync when the profile loads/changes (e.g. name from signup).
  useEffect(()=>{
    setName(profile?.name||'');
    setBiz(profile?.business_name||'');
    setUnitType(profile?.unit_type||'van');
    setAuthority(profile?.authority||'');
    setLpgEnabled(profile?.lpg_enabled!==false);
    setWaterEnabled(profile?.water_enabled??false);
    setTeamSize(profile?.team_size||'solo');
    setFoodType(profile?.food_type||'');
    setHygieneRating(profile?.hygiene_rating??null);
  },[profile?.id]);
  const [saving,setSaving]=useState(false);
  const [flash,setFlash]=useState('');
  const [newPass,setNewPass]=useState('');
  const [passFlash,setPassFlash]=useState('');
  const [passErr,setPassErr]=useState('');
  const [passLoading,setPassLoading]=useState(false);
  const saveProfile=async()=>{
    setSaving(true);
    const{data}=await sb.from('profiles').update({name,business_name:biz,unit_type:unitType,authority,lpg_enabled:lpgEnabled,water_enabled:waterEnabled,team_size:teamSize,food_type:foodType,hygiene_rating:hygieneRating}).eq('id',userId).select().single();
    if(data) onUpdate(data);
    setFlash('Profile saved!'); setTimeout(()=>setFlash(''),2000); setSaving(false);
  };
  const changePass=async()=>{
    setPassErr(''); setPassFlash('');
    if(newPass.length<6){setPassErr('Password must be at least 6 characters.');return;}
    setPassLoading(true);
    const{error}=await sb.auth.updatePassword(newPass);
    if(error){setPassErr(error.message);} else {setPassFlash('Password updated!');setNewPass('');}
    setPassLoading(false);
  };
  const logout=async()=>{if(window.__vgDemo){window.__vgExitDemo&&window.__vgExitDemo();return;}await sb.auth.signOut();};
  const [subLoading,setSubLoading]=useState('');
  const isActive=profile?.subscription_status==='active';
  const isLifetime=profile?.subscription_status==='lifetime';
  const isTrialing=profile?.subscription_status==='trialing';
  const isPastDue=profile?.subscription_status==='past_due';
  const hasStripe=!!profile?.stripe_customer_id;
  const trialDays=profile?.trial_start?Math.floor((new Date()-new Date(profile.trial_start))/86400000):0;
  const trialLeft=isTrialing?Math.max(0,14-trialDays):0;
  const isYearly=profile?.plan_interval==='year';
  const planName=isYearly?'Yearly plan':'Monthly plan';
  const planPrice=isYearly?'£69.99/year':'£7.99/month';
  const cancelling=!!profile?.cancel_at_period_end;
  const periodEnd=profile?.period_end?new Date(profile.period_end):null;
  const fmtEnd=periodEnd&&!isNaN(periodEnd)?periodEnd.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):null;
  const subscribe=async(plan='monthly')=>{
    if(window.__vgDemo){window.__vgExitDemo&&window.__vgExitDemo();return;}
    setSubLoading(plan);
    try{
      const tok=_getS()?.access_token;
      const res=await fetch('/.netlify/functions/create-checkout',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${tok}`},
        body:JSON.stringify({userId,email:profile?.email||_getS()?.user?.email,trial:false}),
      });
      const {url,error}=await res.json();
      if(error)throw new Error(error);
      window.location.href=url;
    } catch(e){
      alert('Could not start checkout: '+e.message);
      setSubLoading('');
    }
  };
  const [portalLoading,setPortalLoading]=useState(false);
  const openPortal=async()=>{
    if(window.__vgDemo){window.__vgExitDemo&&window.__vgExitDemo();return;}
    setPortalLoading(true);
    try{
      const tok=_getS()?.access_token;
      const res=await fetch('/.netlify/functions/create-portal',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${tok}`},
        body:JSON.stringify({userId}),
      });
      const {url,error}=await res.json();
      if(error)throw new Error(error);
      window.location.href=url;
    } catch(e){
      alert('Could not open the billing portal: '+e.message);
      setPortalLoading(false);
    }

// ── RESET PASSWORD SCREEN ────────────────────────────────────────────────────
const ResetPasswordScreen=({token,onDone})=>{
  const [pass,setPass]=useState('');
  const [confirm,setConfirm]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const [ok,setOk]=useState('');
  const submit=async()=>{
    setErr('');
    if(pass.length<6){setErr('Password must be at least 6 characters.');return;}
    if(pass!==confirm){setErr('Passwords do not match.');return;}
    setLoading(true);
    const r=await fetch(`${SUPA_URL}/auth/v1/user`,{method:'PUT',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({password:pass})});
    const d=await r.json();
    if(d.error||d.code>=400){setErr(d.message||'Failed to update password.');setLoading(false);return;}
    setOk('Password updated! Taking you to sign in...');
    setTimeout(onDone,2000);
    setLoading(false);
  };
  return (
    <div className="min-h-screen bg-navy flex flex-col items-center justify-center p-5">
      <img src="/icon-192.png" className="mb-4 shadow-2xl" alt="VanGuard" style={{width:'80px',height:'80px',borderRadius:'20px'}}/>
      <h1 className="text-3xl font-black text-white mb-1">Van<span className="text-teal">Guard</span></h1>
      <p className="text-white/40 text-sm mb-8">Stay compliant. Keep moving.</p>
      <div className="w-full max-w-sm bg-white rounded-2xl p-6 shadow-2xl">
        <h2 className="font-black text-navy text-lg mb-1">Choose a new password</h2>
        <p className="text-sm text-gray-400 mb-4">Make it at least 6 characters.</p>
        <ErrMsg msg={err}/>
        {ok?<OkMsg msg={ok}/>:<>

const InstallPrompt = ({userId}) => {
  const [show,setShow]=useState(false);
  const [isIOS,setIsIOS]=useState(false);
  const [deferred,setDeferred]=useState(null);
  const key=`vg_install_asked_${userId}`;

  useEffect(()=>{
    if(localStorage.getItem(key)) return;
    if(window.matchMedia('(display-mode: standalone)').matches) return;
    if(window.navigator.standalone) return;

    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    setIsIOS(ios);

    const onPrompt=e=>{e.preventDefault();setDeferred(e);};
    window.addEventListener('beforeinstallprompt',onPrompt);

    const t=setTimeout(()=>setShow(true), 45000);
    return ()=>{window.removeEventListener('beforeinstallprompt',onPrompt);clearTimeout(t);};
  },[]);

  const dismiss=()=>{setShow(false);localStorage.setItem(key,'1');};
  const install=async()=>{
    if(deferred){deferred.prompt();await deferred.userChoice;setDeferred(null);}
    dismiss();
  };

  if(!show) return null;
  return (
    <div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:100,padding:'0 12px 20px',maxWidth:'512px',margin:'0 auto'}} className="fade-in">

          </div>

            <p className="text-white font-black text-sm leading-none">Van<span className="text-teal">Guard</span></p>
            <p className="text-white/40 text-xs mt-0.5">Food safety compliance</p>
          </div>
          <button onClick={dismiss} className="text-white/30 hover:text-white/60 text-xl leading-none w-8 h-8 flex items-center justify-center">×</button>
        </div>
        <div className="p-4">
          <p className="font-bold text-navy text-sm mb-1">Add to your Home Screen</p>
          <p className="text-xs text-gray-400 leading-relaxed mb-3">Get instant access to your food safety records — works offline too.</p>
          {isIOS&&(
            <div className="bg-teal-light rounded-xl p-3 text-xs text-gray-600 leading-relaxed mb-3">

const OfflineBanner=()=>{
  const [online,setOnline]=useState(navigator.onLine);
  const [syncing,setSyncing]=useState(false);
  const [flash,setFlash]=useState('');
  useEffect(()=>{
    const goOn=async()=>{
      setOnline(true);
      if(_getQ().length>0){
        setSyncing(true);
        const n=await replayOfflineQueue();
        setSyncing(false);
        if(n>0){setFlash(`✓ ${n} record${n!==1?'s':''} synced`);setTimeout(()=>setFlash(''),3000);}
      }
    };
    const goOff=()=>setOnline(false);
    window.addEventListener('online',goOn);
    window.addEventListener('offline',goOff);
    return()=>{window.removeEventListener('online',goOn);window.removeEventListener('offline',goOff);};
  },[]);
  const bar=(bg,msg)=>(
    <div className="fixed top-0 left-0 right-0 z-[100] max-w-lg mx-auto pointer-events-none">
      <div className={`${bg} text-white text-xs font-bold py-1.5 text-center`}>{msg}</div>
    </div>
  );
  if(flash) return bar('bg-green-500',flash);
  if(syncing) return bar('bg-teal','Syncing offline records...');
  if(!online) return bar('bg-amber-500','Offline — records will sync when reconnected');
  return null;
};

const App = () => {
  const [session,setSession]=useState(null);
  const [profile,setProfile]=useState(null);
  const [screen,setScreen]=useState('dashboard');
  const [appLoading,setAppLoading]=useState(true);
  const [showOnboarding,setShowOnboarding]=useState(false);
  const [showHelp,setShowHelp]=useState(false);
  const [recoveryToken,setRecoveryToken]=useState(null);
  const [checkoutFlash,setCheckoutFlash]=useState('');
  const [showLanding,setShowLanding]=useState(false);
  const [authMode,setAuthMode]=useState(()=>{try{return new URLSearchParams(window.location.search).get('mode')==='login'?'login':'register';}catch{return 'register';}});
  const [demo,setDemo]=useState(()=>{try{return new URLSearchParams(window.location.search).get('demo')==='1';}catch{return false;}});
  // Keep the global flag in sync synchronously during render so the sb data layer
  // sees it before any child effect fires a query.
  window.__vgDemo=demo;
  const enterDemo=()=>{
    gaEvent('demo_started');
    window.__vgDemo=true;
    try{const u=new URL(window.location.href);u.searchParams.set('demo','1');window.history.replaceState(null,'',u.pathname+u.search);}catch{}
    setScreen('dashboard'); setDemo(true);
  };
  const exitDemo=()=>{
    window.__vgDemo=false;
    try{const u=new URL(window.location.href);u.searchParams.delete('demo');window.history.replaceState(null,'',u.pathname+(u.search||''));}catch{}
    setDemo(false); setShowLanding(false); setAuthMode('register');
  };
  window.__vgExitDemo=exitDemo;
  useEffect(()=>{document.body.classList.toggle('vg-demo',demo);},[demo]);

  // Live compliance % for the nav rings, refreshed after any save (via window.__vgRefreshCompliance).
  const [compliance,setCompliance]=useState(0);
  const complianceRef=useRef(0);
  const [confetti,setConfetti]=useState(false);
  const [showFeedback,setShowFeedback]=useState(false);
  const refreshCompliance=async()=>{
    const uid=demo?_DEMO_UID:session?.user?.id;
    if(!uid) return;
    const p=await computeTodayCompliance(uid);
    setCompliance(p);
    if(p>=100&&complianceRef.current<100){
      setConfetti(true);
      if(!demo){
        trackOnce('day_'+uid+'_'+today(),'day_completed');
        // First fully-compliant day → ask for a rating once the confetti has played.
        if(shouldPromptFeedback(uid)){ try{localStorage.setItem('vg_fb_snooze_'+uid,String(Date.now()));}catch{} setTimeout(()=>setShowFeedback(true),3600); }
      }
    }
    complianceRef.current=p;
  };
  window.__vgRefreshCompliance=refreshCompliance;
  useEffect(()=>{ if(demo||session?.user?.id) refreshCompliance(); },[screen,session,demo]);
  // Trial funnel: fire once when the subscription enters trialing / active.
  useEffect(()=>{
    const uid=session?.user?.id; const s=profile?.subscription_status;
    if(demo||!uid||!s) return;
    if(s==='trialing') trackOnce('trial_'+uid,'trial_started');
    if(s==='active') trackOnce('conv_'+uid,'trial_converted');
    // Meta standard events (once each), alongside the GA events above.
    const val=profile?.plan_interval==='year'?69.99:7.99;
    try{
      if(s==='trialing'&&!localStorage.getItem('vg_fb_trial_'+uid)){ localStorage.setItem('vg_fb_trial_'+uid,'1'); fbqt('StartTrial',{currency:'GBP',value:val}); }
      if(s==='active'&&!localStorage.getItem('vg_fb_conv_'+uid)){ localStorage.setItem('vg_fb_conv_'+uid,'1'); fbqt('Subscribe',{currency:'GBP',value:val}); }
    }catch(e){}
  },[profile,session,demo]);

  useEffect(()=>{
    const qs=new URLSearchParams(window.location.search);
    if(qs.get('demo')==='1'){window.__vgDemo=true;setAppLoading(false);return;}
    // Store referral code for use at sign-up
    const ref=qs.get('ref');
    if(ref) localStorage.setItem('vg_ref',ref);
    if(qs.get('checkout')==='success'){
      setCheckoutFlash('success');
      setScreen('account');
      window.history.replaceState(null,'',window.location.pathname);
    } else if(qs.get('checkout')==='cancelled'){
      setCheckoutFlash('cancelled');
      window.history.replaceState(null,'',window.location.pathname);
    } else if(qs.get('screen')==='account'){
      // Returning from the Stripe billing portal.
      setScreen('account');
      window.history.replaceState(null,'',window.location.pathname);
    }
    const hash=window.location.hash;
    if(hash.includes('type=recovery')&&hash.includes('access_token')){
      const params=new URLSearchParams(hash.slice(1));
      const token=params.get('access_token');
      if(token){setRecoveryToken(token);window.history.replaceState(null,'',window.location.pathname);setAppLoading(false);return;}
    }
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      if(session) loadProfile(session.user.id);
      else setAppLoading(false);
    }).catch(()=>setAppLoading(false));
    const {data:{subscription}}=sb.auth.onAuthStateChange(async(_e,session)=>{
      setSession(session);
      if(session) loadProfile(session.user.id);
      else {setProfile(null);setAppLoading(false);}
    });
    const IDLE_MS=30*60*1000;
    let idleTimer=null;
    const resetIdle=()=>{
      clearTimeout(idleTimer);
      idleTimer=setTimeout(()=>{ sb.auth.signOut(); },IDLE_MS);
    };
    const events=['mousemove','mousedown','touchstart','keydown','scroll'];
    events.forEach(e=>window.addEventListener(e,resetIdle,{passive:true}));
    resetIdle();
    return ()=>{
      subscription.unsubscribe();
      clearTimeout(idleTimer);
      events.forEach(e=>window.removeEventListener(e,resetIdle));
    };
  },[]);

  const loadProfile=async(userId)=>{
    try{
      const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
      const{data}=await Promise.race([
        sb.from('profiles').select('*').eq('id',userId).maybeSingle(),
        timeout
      ]);
      setProfile(data);
      hydrateChecklists(userId,data?.custom_checklists);
      if(data?.onboarded) localStorage.setItem('vg_ob_'+userId,'1');
    } catch(e){
      console.error('loadProfile error:',e);
      _saveS(null);
      setSession(null);
    } finally {
      setAppLoading(false);
    }
  };

  // ── DEMO MODE: render the full app with a fake profile + mock data ──
  if(demo) return (
    <div className="lg:flex lg:items-stretch min-h-screen">
      <DemoBanner onExit={exitDemo}/>
      <Confetti show={confetti} onDone={()=>setConfetti(false)}/>
      <DesktopSidebar screen={screen} onChange={setScreen} profile={_DEMO_PROFILE} onHelp={()=>setShowHelp(true)} compliance={compliance}/>
      <div className="app-shell max-w-lg mx-auto lg:max-w-none lg:mx-0 lg:flex-1 relative min-h-screen">
        <div className="lg:hidden"><TopNav screen={screen} onChange={setScreen} profile={_DEMO_PROFILE} compliance={compliance}/></div>
        <div className="vg-content lg:max-w-3xl lg:mx-auto">
          {screen==='dashboard'&&<Dashboard profile={_DEMO_PROFILE} userId={_DEMO_UID} onNav={setScreen}/>}
          {screen==='diary'&&<DiaryScreen userId={_DEMO_UID} profile={_DEMO_PROFILE}/>}
          {screen==='temp'&&<TempScreen userId={_DEMO_UID}/>}
          {screen==='van'&&<VanScreen userId={_DEMO_UID} profile={_DEMO_PROFILE}/>}
          {screen==='records'&&<RecordsScreen userId={_DEMO_UID} profile={_DEMO_PROFILE}/>}
          {screen==='documents'&&<DocumentsScreen userId={_DEMO_UID}/>}
          {screen==='account'&&<AccountScreen userId={_DEMO_UID} profile={_DEMO_PROFILE} onUpdate={()=>{}}/>}
        </div>
        <div className="lg:hidden"><HelpFab onClick={()=>setShowHelp(true)}/></div>
        <HelpDrawer screen={screen} open={showHelp} onClose={()=>setShowHelp(false)}/>
      </div>
    </div>
  );

  if(appLoading) return (
    <div className="min-h-screen bg-navy flex flex-col items-center justify-center gap-5">
      <img src="/icon-192.png" className="w-24 h-24 rounded-3xl shadow-2xl" alt="VanGuard" style={{borderRadius:'22px'}}/>
      <div>
        <p className="text-white font-black text-2xl text-center leading-none">Van<span className="text-teal">Guard</span></p>
        <p className="text-white/30 text-xs text-center mt-1 uppercase tracking-widest">Stay compliant. Keep moving.</p>
      </div>
      <div className="w-6 h-6 border-2 border-white/20 border-t-white rounded-full animate-spin"/>
    </div>
  );

  if(recoveryToken) return <ResetPasswordScreen token={recoveryToken} onDone={()=>setRecoveryToken(null)}/>;
  if(!session) return showLanding
    ? <LandingPage onGetStarted={(m)=>{if(m==='register')track('signup_started');setAuthMode(m);setShowLanding(false);}} onDemo={enterDemo}/>
    : <AuthScreen initialMode={authMode} onBack={()=>{window.location.href='/';}} onDemo={enterDemo}/>;

  if(!session?.user?.id){_saveS(null);setSession(null);return null;}
  const userId=session.user.id;

  const status=profile?.subscription_status;
  const isLifetime=status==='lifetime';
  const isActive=status==='active';
  const isTrialing=status==='trialing';
  const hasStripe=!!profile?.stripe_customer_id;
  const trialDays=profile?.trial_start?Math.floor((new Date()-new Date(profile.trial_start))/86400000):0;
  const trialLeft=Math.max(0,14-trialDays);
  // No-card free trial: a fresh account (status 'trialing' or not yet set) is on the 14-day trial.
  const onTrial=(isTrialing||!status)&&!isActive&&!isLifetime;
  const trialLive=onTrial&&trialLeft>0;
  const hasAccess=isLifetime||isActive||trialLive;
  // Trial ran out (no card), or a card subscription lapsed → must pick a plan.
  const isExpired=!!profile&&!isLifetime&&!isActive&&((onTrial&&trialLeft<=0)||(hasStripe&&(status==='past_due'||status==='cancelled')));

  // 1) Force a one-time onboarding before anything else.
  const needsOnboarding=!!profile&&!profile.onboarded&&!localStorage.getItem('vg_ob_'+userId);
  if(needsOnboarding) return (
    <OnboardingWizard userId={userId} profile={profile} onComplete={p=>{setProfile(p);}}/>
  );

  return (
    <div className="lg:flex lg:items-stretch min-h-screen">
      <Confetti show={confetti} onDone={()=>setConfetti(false)}/>
      <DesktopSidebar screen={screen} onChange={setScreen} profile={profile} onHelp={()=>setShowHelp(true)} compliance={compliance}/>
      <div className="app-shell max-w-lg mx-auto lg:max-w-none lg:mx-0 lg:flex-1 relative min-h-screen">
        <OfflineBanner/>
        <div className="lg:hidden"><TopNav screen={screen} onChange={setScreen} profile={profile} compliance={compliance}/></div>
        <TrialBanner trialLeft={trialLive?trialLeft:0} onUpgrade={()=>setScreen('account')}/>
        {checkoutFlash==='success'&&<div className="fixed left-0 right-0 z-40 max-w-lg mx-auto px-4 pt-3" style={{top:trialLeft>0&&trialLeft<=7?'96px':'56px'}}>
          <div className="bg-green-500 text-white text-sm font-semibold px-4 py-3 rounded-xl flex items-center justify-between shadow-lg">
            <span>Subscription active!</span>
            <button onClick={()=>setCheckoutFlash('')} className="ml-3 opacity-70 text-lg leading-none">x</button>
          </div>
        </div>}
        {checkoutFlash==='cancelled'&&<div className="fixed top-14 left-0 right-0 z-40 max-w-lg mx-auto px-4 pt-3">
          <div className="bg-gray-600 text-white text-sm px-4 py-3 rounded-xl flex items-center justify-between shadow-lg">
            <span>Checkout cancelled.</span>
            <button onClick={()=>setCheckoutFlash('')} className="ml-3 opacity-70 text-lg leading-none">x</button>
          </div>
        </div>}
        <div className="vg-content lg:max-w-3xl lg:mx-auto">
          {isExpired&&screen!=='account'?(
            <PaywallScreen userId={userId} profile={profile}/>
          ):(
            <>
              {screen==='dashboard'&&<Dashboard profile={profile} userId={userId} onNav={setScreen}/>}
              {screen==='diary'&&<DiaryScreen userId={userId} profile={profile}/>}
              {screen==='temp'&&<TempScreen userId={userId}/>}
              {screen==='van'&&<VanScreen userId={userId} profile={profile}/>}
              {screen==='records'&&<RecordsScreen userId={userId} profile={profile}/>}
              {screen==='documents'&&<DocumentsScreen userId={userId}/>}
              {screen==='account'&&<AccountScreen userId={userId} profile={profile} onUpdate={p=>{setProfile(p);}}/>}
            </>
          )}
        </div>
        <div className="lg:hidden"><HelpFab onClick={()=>setShowHelp(true)}/></div>
        <HelpDrawer screen={screen} open={showHelp} onClose={()=>setShowHelp(false)}/>
        {showFeedback&&<FeedbackPrompt userId={userId} email={profile?.email||session?.user?.email} onClose={()=>setShowFeedback(false)}/>}
        <InstallPrompt userId={userId}/>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</textarea>
<script>
function _showErr(msg){
  var r=document.getElementById('root');
  if(r) r.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#1A2744;padding:24px;text-align:center"><p style="color:#ef4444;font-family:monospace;font-size:12px;white-space:pre-wrap;max-width:400px;word-break:break-all">'+String(msg).slice(0,600)+'</p></div>';
}
document.addEventListener('DOMContentLoaded',function(){
  try {
    var src=document.getElementById('__app__').value;
    var result=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]});
    var s=document.createElement('script');
    s.textContent=result.code;
    document.body.appendChild(s);
  } catch(e) {
    _showErr(e.stack||e.message);
  }
});
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
